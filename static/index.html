<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFB627">
<title>小钱袋 · 可爱记账</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👛</text></svg>">
<style>
:root{
  --gold:#FFB627;
  --gold-deep:#F59200;
  --gold-light:#FFD98E;
  --mint:#4ECDC4;
  --mint-deep:#2FB3A9;
  --coral:#FF6B6B;
  --pink:#FF9EC4;
  --cream:#FFF9EE;
  --cream-2:#FFF4E0;
  --ink:#4A3728;
  --ink-2:#8A7361;
  --ink-3:#B8A594;
  --line:#F0E4D2;
  --white:#FFFFFF;
  --green:#37C978;
  --shadow-s:0 2px 8px rgba(200,160,90,.12);
  --shadow-m:0 6px 20px rgba(200,160,90,.16);
  --shadow-l:0 12px 36px rgba(200,160,90,.22);
  --r-s:12px; --r-m:18px; --r-l:26px;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--cream);color:var(--ink);
  overflow:hidden;position:fixed;inset:0;
  font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;border:none;outline:none;background:none}
button{cursor:pointer}
::-webkit-scrollbar{width:0;height:0}

/* ========== 应用外壳 ========== */
#app{height:100%;display:flex;flex-direction:column;overflow:hidden;position:relative}

/* 顶栏 */
.topbar{
  flex:0 0 auto;display:flex;align-items:center;gap:10px;
  padding:calc(var(--safe-t) + 10px) 14px 12px;
  background:linear-gradient(135deg,#FFD070 0%,#FFB627 55%,#FFA726 100%);
  box-shadow:0 3px 14px rgba(240,160,40,.28);
  position:relative;z-index:30;
}
.topbar::after{
  content:"";position:absolute;left:0;right:0;bottom:-9px;height:10px;
  background:linear-gradient(135deg,#FFD070 0%,#FFB627 100%);
  -webkit-mask:radial-gradient(circle at 9px 0,transparent 9px,#000 9.5px) 0 0/18px 10px repeat-x;
  mask:radial-gradient(circle at 9px 0,transparent 9px,#000 9.5px) 0 0/18px 10px repeat-x;
  pointer-events:none;
}
.icon-btn{
  width:38px;height:38px;border-radius:12px;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;font-size:19px;
  background:rgba(255,255,255,.32);color:#7A4A00;
  transition:transform .15s,background .15s;
}
.icon-btn:active{transform:scale(.88);background:rgba(255,255,255,.55)}
.topbar-title{flex:1;min-width:0}
.topbar-title h1{font-size:17px;font-weight:800;color:#6B3F00;letter-spacing:.3px;display:flex;align-items:center;gap:5px}
.topbar-title p{font-size:11px;color:#9A6A20;margin-top:1px;font-weight:500}
.topbar .brand-emoji{font-size:22px;filter:drop-shadow(0 2px 3px rgba(150,90,0,.25))}

/* 内容区 */
.content{
  flex:1;overflow-y:auto;overflow-x:hidden;
  padding:20px 14px calc(var(--safe-b) + 92px);
  -webkit-overflow-scrolling:touch;
}
.page{display:none;animation:fadeUp .32s ease}
.page.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ========== 抽屉导航 ========== */
#scrim{
  position:fixed;inset:0;background:rgba(74,55,40,.42);
  opacity:0;pointer-events:none;transition:opacity .28s;z-index:90;
  backdrop-filter:blur(2px);
}
#scrim.show{opacity:1;pointer-events:auto}
#drawer{
  position:fixed;top:0;bottom:0;left:0;width:266px;max-width:82vw;
  background:linear-gradient(170deg,#FFFDF7,#FFF6E4);
  z-index:100;transform:translateX(-102%);transition:transform .3s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column;
  box-shadow:8px 0 32px rgba(150,110,50,.22);
  border-right:1px solid var(--line);
}
#drawer.show{transform:none}
.drawer-head{
  padding:calc(var(--safe-t) + 22px) 20px 18px;
  background:linear-gradient(135deg,#FFD070,#FFB627);
  position:relative;overflow:hidden;
}
.drawer-head::before{
  content:"🪙";position:absolute;right:-8px;top:6px;font-size:64px;opacity:.28;transform:rotate(18deg);
}
.drawer-head::after{
  content:"👛";position:absolute;right:44px;bottom:-14px;font-size:40px;opacity:.22;transform:rotate(-12deg);
}
.drawer-head h2{font-size:19px;font-weight:800;color:#6B3F00;position:relative;z-index:1}
.drawer-head p{font-size:11.5px;color:#8A5A10;margin-top:3px;position:relative;z-index:1;font-weight:500}
.drawer-nav{flex:1;overflow-y:auto;padding:10px 10px 16px}
.nav-item{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  padding:11px 13px;border-radius:14px;margin-bottom:2px;
  font-size:14.5px;font-weight:600;color:var(--ink-2);
  transition:background .16s,color .16s,transform .12s;
}
.nav-item:active{transform:scale(.97)}
.nav-item .ni-icon{
  width:32px;height:32px;border-radius:10px;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;font-size:17px;
  background:var(--cream-2);
  transition:transform .2s;
}
.nav-item.active{background:linear-gradient(100deg,#FFF0CF,#FFE7B4);color:#8A5200}
.nav-item.active .ni-icon{background:#fff;box-shadow:var(--shadow-s);transform:scale(1.06)}
.nav-item .ni-badge{
  margin-left:auto;font-size:10px;font-weight:800;padding:2px 7px;border-radius:8px;
  background:var(--coral);color:#fff;
}
.drawer-foot{padding:12px 18px calc(var(--safe-b) + 14px);border-top:1px solid var(--line)}
.drawer-foot p{font-size:10.5px;color:var(--ink-3);text-align:center;line-height:1.6}

/* ========== 通用组件 ========== */
.card{
  background:var(--white);border-radius:var(--r-m);padding:16px;
  box-shadow:var(--shadow-s);margin-bottom:13px;
  border:1px solid rgba(240,228,210,.7);
}
.card-t{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.card-t h3{font-size:15px;font-weight:800;display:flex;align-items:center;gap:6px}
.card-t .more{font-size:12px;color:var(--ink-3);font-weight:600}
.sec-title{
  font-size:13px;font-weight:800;color:var(--ink-2);margin:20px 2px 10px;
  display:flex;align-items:center;gap:6px;
}
.sec-title::before{content:"";width:4px;height:14px;border-radius:3px;background:linear-gradient(var(--gold),var(--gold-deep))}
.empty{text-align:center;padding:36px 16px;color:var(--ink-3)}
.empty .e-icon{font-size:46px;display:block;margin-bottom:10px;opacity:.65}
.empty p{font-size:13px;line-height:1.7}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:11px 18px;border-radius:14px;font-size:14px;font-weight:700;
  background:linear-gradient(135deg,var(--gold-light),var(--gold));
  color:#6B3F00;box-shadow:var(--shadow-s);
  transition:transform .14s,box-shadow .14s;white-space:nowrap;
}
.btn:active{transform:scale(.95);box-shadow:none}
.btn.block{width:100%}
.btn.ghost{background:var(--cream-2);color:var(--ink-2);box-shadow:none}
.btn.mint{background:linear-gradient(135deg,#7FE3DC,var(--mint));color:#0E5C56}
.btn.coral{background:linear-gradient(135deg,#FF9A9A,var(--coral));color:#fff}
.btn.sm{padding:8px 14px;font-size:12.5px;border-radius:11px}
.field{margin-bottom:13px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--ink-2);margin-bottom:6px;padding-left:2px}
.input{
  width:100%;padding:12px 14px;border-radius:13px;background:var(--cream);
  border:1.5px solid var(--line);font-size:15px;font-weight:600;
  transition:border-color .16s,background .16s;
}
.input:focus{border-color:var(--gold);background:#fff}
textarea.input{resize:none;line-height:1.5}
.chip{
  display:inline-flex;align-items:center;gap:4px;
  padding:6px 12px;border-radius:20px;font-size:12.5px;font-weight:700;
  background:var(--cream-2);color:var(--ink-2);border:1.5px solid transparent;
  transition:all .16s;
}
.chip:active{transform:scale(.94)}
.chip.on{background:linear-gradient(135deg,var(--gold-light),var(--gold));color:#6B3F00;box-shadow:var(--shadow-s)}
.chips{display:flex;flex-wrap:wrap;gap:7px}

/* 进度条 */
.bar{height:10px;border-radius:8px;background:var(--cream-2);overflow:hidden;position:relative}
.bar > i{
  display:block;height:100%;border-radius:8px;
  background:linear-gradient(90deg,var(--gold-light),var(--gold));
  transition:width .6s cubic-bezier(.3,1.2,.5,1);
}
.bar.warn > i{background:linear-gradient(90deg,#FFC46B,var(--coral))}
.bar.over > i{background:linear-gradient(90deg,var(--coral),#E8413C)}
.bar > i::after{
  content:"";position:absolute;inset:0;border-radius:8px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);
  animation:shine 2.4s infinite;
}
@keyframes shine{0%{transform:translateX(-100%)}60%,100%{transform:translateX(100%)}}

/* ========== 首页 ========== */
.hero{
  border-radius:var(--r-l);padding:20px;color:#fff;position:relative;overflow:hidden;
  background:linear-gradient(135deg,#FFCF6B 0%,#FFB627 48%,#FF9330 100%);
  box-shadow:var(--shadow-m);margin-bottom:14px;
}
.hero::before{content:"💰";position:absolute;right:-14px;top:-14px;font-size:96px;opacity:.16;transform:rotate(14deg)}
.hero::after{content:"🪙";position:absolute;right:58px;bottom:-22px;font-size:52px;opacity:.18;transform:rotate(-16deg)}
.hero .h-label{font-size:12px;font-weight:700;opacity:.92;display:flex;align-items:center;gap:5px}
.hero .h-amount{font-size:38px;font-weight:900;letter-spacing:-1px;margin:4px 0 2px;text-shadow:0 3px 10px rgba(160,90,0,.22);position:relative;z-index:1}
.hero .h-amount small{font-size:18px;font-weight:700;margin-right:2px}
.hero .h-sub{font-size:11.5px;opacity:.9;font-weight:600;position:relative;z-index:1}
.hero .h-row{display:flex;gap:9px;margin-top:15px;position:relative;z-index:1}
.hero .h-pill{
  flex:1;background:rgba(255,255,255,.24);border-radius:14px;padding:9px 11px;
  backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.32);
}
.hero .h-pill b{display:block;font-size:16px;font-weight:800}
.hero .h-pill span{font-size:10.5px;opacity:.92;font-weight:600}

.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:13px}
.stat-card{
  background:var(--white);border-radius:var(--r-m);padding:13px 10px;text-align:center;
  box-shadow:var(--shadow-s);border:1px solid rgba(240,228,210,.7);
}
.stat-card .sc-icon{font-size:20px;margin-bottom:3px;display:block}
.stat-card b{display:block;font-size:16px;font-weight:900;letter-spacing:-.4px}
.stat-card span{font-size:10.5px;color:var(--ink-3);font-weight:700}
.c-red{color:#E8413C}.c-green{color:var(--green)}.c-gold{color:var(--gold-deep)}.c-mint{color:var(--mint-deep)}

.quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.quick-item{
  background:var(--white);border-radius:16px;padding:12px 6px;text-align:center;
  box-shadow:var(--shadow-s);transition:transform .14s;border:1px solid rgba(240,228,210,.7);
}
.quick-item:active{transform:scale(.93)}
.quick-item .qi{font-size:22px;display:block;margin-bottom:4px}
.quick-item span{font-size:10.5px;font-weight:700;color:var(--ink-2)}

/* 账目项 */
.tx{
  display:flex;align-items:center;gap:11px;padding:11px 4px;
  border-bottom:1px solid var(--line);transition:background .14s;
}
.tx:last-child{border-bottom:none}
.tx:active{background:var(--cream)}
.tx .tx-icon{
  width:42px;height:42px;border-radius:13px;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;font-size:20px;
  background:var(--cream-2);
}
.tx .tx-mid{flex:1;min-width:0}
.tx .tx-mid b{display:block;font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .tx-mid span{font-size:11px;color:var(--ink-3);font-weight:600}
.tx .tx-amt{font-size:15.5px;font-weight:800;white-space:nowrap;letter-spacing:-.3px}
.tx .tx-amt.exp{color:#E8413C}
.tx .tx-amt.inc{color:var(--green)}
.tx-del{
  width:30px;height:30px;border-radius:9px;flex:0 0 auto;font-size:14px;
  display:flex;align-items:center;justify-content:center;
  background:var(--cream-2);color:var(--ink-3);
}
.tx-del:active{background:#FFE0E0;color:var(--coral)}
.day-group{margin-bottom:6px}
.day-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 2px 6px;font-size:12px;font-weight:800;color:var(--ink-2);
  position:sticky;top:-1px;background:var(--cream);z-index:2;
}
.day-head .dh-sum{font-size:11.5px;color:var(--ink-3);font-weight:700}

/* ========== 小助手 ========== */
.chat-wrap{
  display:flex;flex-direction:column;
  height:calc(100vh - var(--safe-t) - 118px);
  margin:-20px -14px calc(-1 * (var(--safe-b) + 92px));position:relative;
}
.chat-body{flex:1;overflow-y:auto;padding:16px 14px 8px}
.msg{display:flex;gap:8px;margin-bottom:14px;animation:msgIn .3s ease}
@keyframes msgIn{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
.msg .avatar{
  width:36px;height:36px;border-radius:12px;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;font-size:19px;
  background:linear-gradient(135deg,var(--gold-light),var(--gold));
  box-shadow:var(--shadow-s);
}
.bubble{
  max-width:78%;padding:11px 14px;border-radius:16px;font-size:14px;line-height:1.6;
  font-weight:500;word-break:break-word;box-shadow:var(--shadow-s);
}
.msg.bot .bubble{background:var(--white);border-top-left-radius:5px;color:var(--ink)}
.msg.me{flex-direction:row-reverse}
.msg.me .avatar{background:linear-gradient(135deg,#9DE8E2,var(--mint))}
.msg.me .bubble{
  background:linear-gradient(135deg,var(--gold-light),var(--gold));
  color:#6B3F00;border-top-right-radius:5px;font-weight:600;
}
.bubble .txcard{
  margin-top:9px;background:var(--cream);border-radius:12px;padding:9px 11px;
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  border:1px solid var(--line);
}
.bubble .txcard .tc-l{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700}
.bubble .txcard .tc-amt{font-size:14.5px;font-weight:900;color:#E8413C}
.typing{display:flex;gap:4px;padding:4px 2px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--ink-3);animation:blink 1.3s infinite}
.typing i:nth-child(2){animation-delay:.18s}.typing i:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,60%,100%{opacity:.28;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}
.chat-foot{
  flex:0 0 auto;padding:10px 12px calc(var(--safe-b) + 10px);
  background:var(--white);border-top:1px solid var(--line);
  box-shadow:0 -4px 18px rgba(200,160,90,.1);
}
.chat-suggest{display:flex;gap:7px;overflow-x:auto;padding-bottom:9px}
.chat-suggest .chip{flex:0 0 auto;font-size:12px;padding:7px 12px}
.chat-input-row{display:flex;gap:8px;align-items:flex-end}
.chat-input{
  flex:1;padding:11px 15px;border-radius:20px;background:var(--cream);
  border:1.5px solid var(--line);font-size:14.5px;resize:none;max-height:96px;
  line-height:1.5;font-weight:500;
}
.chat-input:focus{border-color:var(--gold);background:#fff}
.send-btn{
  width:44px;height:44px;border-radius:50%;flex:0 0 auto;font-size:19px;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--gold-light),var(--gold));
  box-shadow:var(--shadow-m);transition:transform .14s;
}
.send-btn:active{transform:scale(.88)}
.mic-btn{width:44px;height:44px;border-radius:50%;flex:0 0 auto;font-size:19px;display:flex;align-items:center;justify-content:center;background:var(--cream-2)}
.mic-btn.rec{background:#FFDCDC;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}

/* ========== 图表 ========== */
.pie-wrap{display:flex;align-items:center;gap:16px}
.pie-wrap svg{flex:0 0 auto}
.legend{flex:1;min-width:0}
.legend-item{display:flex;align-items:center;gap:7px;margin-bottom:7px;font-size:12.5px;font-weight:600}
.legend-item .dot{width:10px;height:10px;border-radius:4px;flex:0 0 auto}
.legend-item .lg-name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
.legend-item .lg-val{font-weight:800;color:var(--ink);font-size:12px}
.legend-item .lg-pct{font-weight:700;color:var(--ink-3);font-size:11px;width:38px;text-align:right}
.bars{display:flex;align-items:flex-end;gap:6px;height:150px;padding:0 2px}
.bars .bcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end}
.bars .bcol .bv{font-size:9.5px;font-weight:800;color:var(--ink-2)}
.bars .bcol .bar-v{
  width:100%;max-width:30px;border-radius:7px 7px 3px 3px;
  background:linear-gradient(180deg,var(--gold),var(--gold-deep));
  transition:height .7s cubic-bezier(.3,1.2,.5,1);min-height:3px;
}
.bars .bcol.bl .bar-v{background:linear-gradient(180deg,#FFD9D9,var(--coral))}
.bars .bcol .bl-lab{font-size:10px;font-weight:700;color:var(--ink-3)}
.rank-item{display:flex;align-items:center;gap:11px;margin-bottom:11px}
.rank-no{
  width:24px;height:24px;border-radius:8px;flex:0 0 auto;font-size:12px;font-weight:900;
  display:flex;align-items:center;justify-content:center;background:var(--cream-2);color:var(--ink-2);
}
.rank-no.top1{background:linear-gradient(135deg,#FFE08A,#FFB627);color:#6B3F00}
.rank-no.top2{background:linear-gradient(135deg,#E8E8E8,#C9C9C9);color:#5A5A5A}
.rank-no.top3{background:linear-gradient(135deg,#FFD8B0,#E8A87C);color:#7A4520}
.rank-item .rk-mid{flex:1;min-width:0}
.rank-item .rk-top{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:4px}
.rank-item .rk-top .rk-pct{color:var(--ink-3);font-size:11.5px;font-weight:700}
.rank-item .bar{height:7px}

/* ========== 日历 ========== */
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-nav b{font-size:16px;font-weight:800}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-h{text-align:center;font-size:11px;font-weight:800;color:var(--ink-3);padding:4px 0}
.cal-d{
  aspect-ratio:1;border-radius:12px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;font-size:12px;font-weight:700;
  background:var(--cream);position:relative;transition:transform .14s;
  border:1.5px solid transparent;gap:1px;
}
.cal-d:active{transform:scale(.9)}
.cal-d.out{opacity:.28}
.cal-d.today{border-color:var(--gold);font-weight:900}
.cal-d .cd-num{line-height:1}
.cal-d .cd-amt{font-size:8px;font-weight:800;opacity:.85;line-height:1}
.cal-d.lv1{background:#FFF3D6}
.cal-d.lv2{background:#FFE3A8}
.cal-d.lv3{background:#FFCE6B}
.cal-d.lv4{background:#FFB627;color:#5A3200}
.cal-d.lv5{background:#F08A1E;color:#fff}
.cal-legend{display:flex;align-items:center;justify-content:flex-end;gap:5px;margin-top:12px;font-size:10.5px;color:var(--ink-3);font-weight:600}
.cal-legend i{width:13px;height:13px;border-radius:4px;display:block}

/* ========== 存钱罐 / 目标 ========== */
.goal-card{
  background:var(--white);border-radius:var(--r-m);padding:15px;margin-bottom:12px;
  box-shadow:var(--shadow-s);border:1px solid rgba(240,228,210,.7);position:relative;overflow:hidden;
}
.goal-card::before{content:"";position:absolute;right:-20px;top:-20px;width:80px;height:80px;border-radius:50%;background:rgba(255,182,39,.08)}
.goal-head{display:flex;align-items:center;gap:11px;margin-bottom:11px;position:relative}
.goal-ico{width:46px;height:46px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:24px;background:var(--cream-2);flex:0 0 auto}
.goal-head .gh-mid{flex:1;min-width:0}
.goal-head .gh-mid b{display:block;font-size:15px;font-weight:800}
.goal-head .gh-mid span{font-size:11.5px;color:var(--ink-3);font-weight:600}
.goal-amt{display:flex;justify-content:space-between;align-items:baseline;margin:8px 0 7px;font-size:12px;font-weight:700;color:var(--ink-2)}
.goal-amt b{font-size:16px;font-weight:900;color:var(--gold-deep)}
.goal-actions{display:flex;gap:8px;margin-top:12px}

/* ========== 成就 ========== */
.streak-hero{
  border-radius:var(--r-l);padding:20px;text-align:center;color:#fff;margin-bottom:14px;
  background:linear-gradient(135deg,#FF9A5A,#FF6B6B);box-shadow:var(--shadow-m);position:relative;overflow:hidden;
}
.streak-hero::before{content:"🔥";position:absolute;left:-10px;bottom:-18px;font-size:80px;opacity:.16}
.streak-hero .sh-num{font-size:46px;font-weight:900;line-height:1;text-shadow:0 3px 12px rgba(150,40,20,.28)}
.streak-hero .sh-num small{font-size:17px;font-weight:700}
.streak-hero .sh-lab{font-size:13px;font-weight:700;opacity:.95;margin-top:5px}
.streak-hero .sh-sub{font-size:11px;opacity:.88;margin-top:3px;font-weight:600}
.badge-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge{
  background:var(--white);border-radius:16px;padding:13px 8px;text-align:center;
  box-shadow:var(--shadow-s);border:1.5px solid var(--line);transition:transform .16s;
}
.badge.locked{opacity:.42;filter:grayscale(.85)}
.badge.got{border-color:var(--gold-light);background:linear-gradient(160deg,#FFFDF6,#FFF8E8)}
.badge:active{transform:scale(.94)}
.badge .bg-ico{font-size:29px;display:block;margin-bottom:5px}
.badge b{display:block;font-size:12px;font-weight:800;margin-bottom:2px}
.badge span{font-size:10px;color:var(--ink-3);font-weight:600;line-height:1.35;display:block}

/* ========== 设置 ========== */
.set-row{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:none}
.set-row .sr-ico{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:18px;background:var(--cream-2);flex:0 0 auto}
.set-row .sr-mid{flex:1;min-width:0}
.set-row .sr-mid b{display:block;font-size:14px;font-weight:700}
.set-row .sr-mid span{font-size:11.5px;color:var(--ink-3);font-weight:600;display:block;line-height:1.45}
.switch{width:46px;height:27px;border-radius:20px;background:var(--line);position:relative;flex:0 0 auto;transition:background .22s}
.switch.on{background:var(--gold)}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.2);transition:transform .22s}
.switch.on::after{transform:translateX(19px)}

/* ========== 弹窗 ========== */
#sheet{position:fixed;inset:0;z-index:200;display:none}
#sheet.show{display:block}
#sheet .sh-scrim{position:absolute;inset:0;background:rgba(74,55,40,.44);animation:fadeIn .22s;backdrop-filter:blur(2px)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
#sheet .sh-panel{
  position:absolute;left:0;right:0;bottom:0;background:var(--cream);
  border-radius:26px 26px 0 0;padding:8px 16px calc(var(--safe-b) + 18px);
  max-height:88vh;overflow-y:auto;animation:slideUp .3s cubic-bezier(.3,1.1,.5,1);
  box-shadow:0 -8px 34px rgba(150,110,50,.22);
}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
.sh-grip{width:38px;height:4.5px;border-radius:3px;background:var(--line);margin:6px auto 14px}
.sh-title{font-size:17px;font-weight:800;margin-bottom:15px;display:flex;align-items:center;gap:7px}
.type-tabs{display:flex;gap:8px;background:var(--cream-2);padding:4px;border-radius:14px;margin-bottom:15px}
.type-tab{flex:1;padding:9px;border-radius:11px;font-size:13.5px;font-weight:800;color:var(--ink-3);transition:all .2s}
.type-tab.on{background:#fff;color:var(--ink);box-shadow:var(--shadow-s)}
.type-tab.on.exp{color:#E8413C}
.type-tab.on.inc{color:var(--green)}
.cat-pick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cat-p{
  padding:11px 4px;border-radius:14px;text-align:center;background:var(--cream-2);
  border:1.5px solid transparent;transition:all .16s;
}
.cat-p:active{transform:scale(.93)}
.cat-p.on{background:#fff;border-color:var(--gold);box-shadow:var(--shadow-s)}
.cat-p .cp-ico{font-size:21px;display:block;margin-bottom:2px}
.cat-p span{font-size:10px;font-weight:700;color:var(--ink-2);display:block}
.amount-input{
  font-size:34px;font-weight:900;text-align:center;width:100%;padding:8px 0;
  color:var(--ink);letter-spacing:-1px;
}
.amount-input::placeholder{color:var(--ink-3);opacity:.5}
.sh-actions{display:flex;gap:10px;margin-top:16px}
.sh-actions .btn{flex:1}

/* 吐司 */
#toast{
  position:fixed;left:50%;bottom:calc(var(--safe-b) + 96px);transform:translateX(-50%) translateY(20px);
  background:rgba(74,55,40,.94);color:#fff;padding:11px 20px;border-radius:14px;
  font-size:13.5px;font-weight:700;z-index:300;opacity:0;pointer-events:none;
  transition:opacity .24s,transform .24s;max-width:86vw;text-align:center;
  box-shadow:0 8px 24px rgba(0,0,0,.25);
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* 金币飘落动画 */
.coin-fly{
  position:fixed;font-size:26px;pointer-events:none;z-index:280;
  animation:coinUp 1.15s cubic-bezier(.2,.8,.4,1) forwards;
}
@keyframes coinUp{
  0%{opacity:0;transform:translateY(0) scale(.5) rotate(0)}
  22%{opacity:1;transform:translateY(-42px) scale(1.18) rotate(16deg)}
  100%{opacity:0;transform:translateY(-118px) scale(.7) rotate(-24deg)}
}
.fab{
  position:fixed;right:16px;bottom:calc(var(--safe-b) + 22px);z-index:60;
  width:56px;height:56px;border-radius:20px;font-size:26px;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--gold-light),var(--gold));
  box-shadow:0 8px 24px rgba(240,160,40,.42);transition:transform .16s;
}
.fab:active{transform:scale(.9)}
@media(min-width:680px){
  #app{max-width:520px;margin:0 auto;box-shadow:0 0 40px rgba(200,160,90,.18)}
  body{background:#F5EAD6}
  #drawer{left:50%;transform:translateX(calc(-50% - 260px)) translateX(-102%)}
  #drawer.show{transform:translateX(calc(-50% - 260px))}
}

/* ================= v2 新增 ================= */

/* ---- 账本切换条 ---- */
.book-bar{
  margin:0 0 12px;padding:9px 10px;border-radius:16px;
  background:linear-gradient(135deg,#FFF7E4,#FFEFD2);
  border:1px solid rgba(255,182,39,.42);
}
.book-chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.book-chips::-webkit-scrollbar{display:none}
.book-chip{
  flex:0 0 auto;display:flex;align-items:center;gap:4px;
  padding:7px 12px;border-radius:20px;font-size:12.5px;font-weight:800;
  background:#fff;color:var(--ink-2);border:1.5px solid transparent;
  transition:all .16s;white-space:nowrap;
}
.book-chip:active{transform:scale(.94)}
.book-chip.on{
  background:linear-gradient(135deg,var(--gold-light),var(--gold));
  color:#6B3F00;border-color:#fff;box-shadow:0 3px 10px rgba(240,160,40,.35);
}
.book-chip .bc-dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.book-manage{
  margin-top:8px;width:100%;padding:7px;border-radius:12px;font-size:12px;font-weight:800;
  background:rgba(255,255,255,.72);color:var(--ink-2);border:1px dashed rgba(255,182,39,.6);
}
.book-manage:active{background:#fff}
.drawer .book-bar{margin-bottom:10px}

/* ---- 颜色选择 ---- */
.color-chip{
  width:30px;height:30px;border-radius:50%;flex:0 0 auto;
  border:2.5px solid transparent;transition:transform .14s;
  position:relative;
}
.color-chip:active{transform:scale(.86)}
.color-chip.on{border-color:var(--ink);box-shadow:0 0 0 2px #fff inset}
.color-row{display:flex;flex-wrap:wrap;gap:9px;margin:6px 0 4px}

/* ---- 图标选择面板 ---- */
.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;max-height:180px;overflow-y:auto;padding:4px 2px}
.emoji-cell{
  aspect-ratio:1;border-radius:11px;font-size:19px;display:flex;align-items:center;justify-content:center;
  background:var(--cream-2);border:1.5px solid transparent;transition:all .14s;
}
.emoji-cell:active{transform:scale(.88)}
.emoji-cell.on{background:#fff;border-color:var(--gold);box-shadow:var(--shadow-s)}

/* ---- 分类管理行 ---- */
.cat-row{
  display:flex;align-items:center;gap:10px;padding:10px 4px;
  border-bottom:1px solid var(--line);
}
.cat-row:last-child{border-bottom:none}
.cat-row.hidden-cat{opacity:.45}
.cat-ico{
  width:40px;height:40px;border-radius:13px;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;font-size:19px;
  background:var(--cream-2);
}
.cat-row .cr-mid{flex:1;min-width:0}
.cat-row .cr-mid b{display:block;font-size:14px;font-weight:700}
.cat-row .cr-mid span{font-size:11px;color:var(--ink-3);font-weight:600}
.cat-ops{display:flex;gap:4px;flex:0 0 auto}
.mini-op{
  width:29px;height:29px;border-radius:9px;font-size:12.5px;
  display:flex;align-items:center;justify-content:center;
  background:var(--cream-2);color:var(--ink-2);transition:all .14s;
}
.mini-op:active{background:var(--cream);transform:scale(.9)}
.mini-op.danger:active{background:#FFE0E0;color:var(--coral)}
.mini-op:disabled{opacity:.28}

/* ---- 标签 ---- */
.tag-chip{
  display:inline-flex;align-items:center;gap:3px;
  padding:4px 10px;border-radius:20px;font-size:11.5px;font-weight:700;
  background:rgba(78,205,196,.16);color:var(--mint-deep);border:1px solid rgba(78,205,196,.36);
}
.tag-chip.pick{background:#fff;color:var(--ink-2);border-color:var(--line);transition:all .16s}
.tag-chip.pick.on{background:linear-gradient(135deg,var(--mint),var(--mint-deep));color:#fff;border-color:transparent}
.tag-list{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.tag-inline{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}

/* ---- 模板 ---- */
.tpl-card{
  background:var(--white);border-radius:var(--r-m);padding:13px;margin-bottom:10px;
  box-shadow:var(--shadow-s);border:1px solid rgba(240,228,210,.7);
  display:flex;align-items:center;gap:11px;
}
.tpl-card .tp-ico{width:42px;height:42px;border-radius:13px;background:var(--cream-2);display:flex;align-items:center;justify-content:center;font-size:20px;flex:0 0 auto}
.tpl-card .tp-mid{flex:1;min-width:0}
.tpl-card .tp-mid b{display:block;font-size:14.5px;font-weight:800}
.tpl-card .tp-mid span{font-size:11.5px;color:var(--ink-3);font-weight:600}
.tpl-card .tp-amt{font-size:15px;font-weight:900;color:#E8413C;flex:0 0 auto}

/* ---- 挑战 ---- */
.chal-hero{
  border-radius:var(--r-l);padding:18px;color:#fff;margin-bottom:14px;
  background:linear-gradient(135deg,#FF7EA8,#FF9A5A 60%,#FFB627);
  box-shadow:var(--shadow-m);position:relative;overflow:hidden;
}
.chal-hero::before{content:"🐖";position:absolute;right:-8px;bottom:-20px;font-size:88px;opacity:.18}
.chal-hero .ch-t{font-size:13px;font-weight:800;opacity:.95}
.chal-hero .ch-big{font-size:34px;font-weight:900;line-height:1.1;margin:5px 0 3px}
.chal-hero .ch-big small{font-size:15px;font-weight:700}
.chal-hero .ch-s{font-size:11.5px;opacity:.92;font-weight:600}
.chal-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}
.chal-cell{
  aspect-ratio:1;border-radius:9px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;font-size:9px;font-weight:800;
  background:var(--cream-2);color:var(--ink-3);position:relative;transition:transform .14s;
  border:1.5px solid transparent;line-height:1.1;
}
.chal-cell:active{transform:scale(.9)}
.chal-cell.done{background:linear-gradient(160deg,#FFD98A,#FFB627);color:#6B3F00;box-shadow:0 2px 6px rgba(240,160,40,.32)}
.chal-cell.part{background:#FFF0CE;color:#B8860B;border-color:#FFD98A}
.chal-cell.today{border-color:var(--coral);border-style:dashed}
.chal-cell b{font-size:10.5px}

/* ---- 附件 ---- */
.attach-strip{display:flex;gap:8px;overflow-x:auto;padding:4px 0}
.attach-thumb{
  width:64px;height:64px;border-radius:13px;flex:0 0 auto;object-fit:cover;
  border:1.5px solid var(--line);background:var(--cream-2);
}
.attach-add{
  width:64px;height:64px;border-radius:13px;flex:0 0 auto;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  background:var(--cream-2);border:1.5px dashed var(--line);color:var(--ink-3);
  font-size:9.5px;font-weight:700;
}
.attach-add span:first-child{font-size:20px}
.attach-wrap{position:relative;flex:0 0 auto}
.attach-del{
  position:absolute;right:-5px;top:-5px;width:20px;height:20px;border-radius:50%;
  background:var(--coral);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;
  box-shadow:var(--shadow-s);
}
.tx-attach-dot{
  display:inline-flex;align-items:center;gap:2px;font-size:10px;font-weight:700;
  color:var(--mint-deep);background:rgba(78,205,196,.16);padding:1px 6px;border-radius:8px;margin-left:4px;
}

/* ---- 详情大图 ---- */
.img-viewer{position:fixed;inset:0;z-index:400;background:rgba(20,14,8,.92);display:flex;align-items:center;justify-content:center;padding:20px}
.img-viewer img{max-width:100%;max-height:88vh;border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.img-viewer .iv-close{position:absolute;top:calc(var(--safe-t) + 12px);right:20px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.2);color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center}

/* ---- 分段控件 ---- */
.seg{display:flex;gap:6px;background:var(--cream-2);padding:4px;border-radius:14px;margin-bottom:13px}
.seg button{flex:1;padding:8px;border-radius:11px;font-size:13px;font-weight:800;color:var(--ink-3);transition:all .18s}
.seg button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow-s)}

/* ---- 空状态 ---- */
.empty{padding:34px 20px;text-align:center}
.empty .em-ico{font-size:52px;display:block;margin-bottom:10px;opacity:.85}
.empty b{display:block;font-size:15px;font-weight:800;margin-bottom:5px}
.empty span{font-size:12.5px;color:var(--ink-3);font-weight:600;line-height:1.6;display:block}

/* ---- 提示卡 ---- */
.notice{
  background:linear-gradient(135deg,#FFF7E4,#FFEFD2);border:1px solid rgba(255,182,39,.42);
  border-radius:14px;padding:11px 13px;font-size:12.5px;font-weight:600;color:var(--ink-2);
  line-height:1.55;margin-bottom:12px;
}
.notice b{color:var(--ink)}

/* ---- 情侣版：谁记的标记 ---- */
.who-tag{
  display:inline-flex;align-items:center;gap:3px;
  font-size:10px;font-weight:800;padding:2px 8px;border-radius:9px;white-space:nowrap;
}
#syncDot{
  display:flex;align-items:center;justify-content:center;width:34px;height:34px;
  border-radius:11px;background:rgba(255,255,255,.5);font-size:16px;
}
.btn.disabled,.btn[disabled]{opacity:.42;pointer-events:none}
.owner-dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:0 0 auto}
</style>

  load(){
    try{
      const raw = localStorage.getItem(this.key);
      this.data = raw ? JSON.parse(raw) : null;
    }catch(e){ this.data = null; }
    if(!this.data) this.data = this.seed();
    return this.normalize(this.data);

  /* 统一兜底 + 老数据迁移。load 与「导入 JSON」都必须走这里 */
  normalize(d){
    d = d || {};
    d.v = 2;
    d.tx = d.tx || [];

    /* 账本 */
    if(!Array.isArray(d.books) || !d.books.length){
      // 老数据迁移：若已有账目，建一个「日常」账本承接
      d.books = [Object.assign({}, DEFAULT_BOOK)];
    }
    const bookIds = d.books.map(b=>b.id);
    // 账目回填 book
    d.tx.forEach(t=>{ if(!t.book || !bookIds.includes(t.book)) t.book = d.books[0].id; });
    if(!d.curBook) d.curBook = d.books[0].id;
    if(d.curBook!=='all' && !bookIds.includes(d.curBook)) d.curBook = d.books[0].id;

    /* 分类：补 id / hidden / words，并给老分类生成稳定 id */
    d.cats = d.cats || JSON.parse(JSON.stringify(DEFAULT_CATS));
    ['expense','income'].forEach(k=>{
      d.cats[k] = d.cats[k] || [];
      d.cats[k].forEach(c=>{
        if(!c.id) c.id = 'c'+uid();
        if(c.hidden === undefined) c.hidden = false;
        if(!Array.isArray(c.words)) c.words = [];
      });
    });

    /* 预算：老结构 {total,cats} → books 结构 */
    d.budget = d.budget || {};
    if(!d.budget.books){
      d.budget = { books: { [d.books[0].id]: { total: d.budget.total||0, cats: d.budget.cats||{} } } };
    }
    d.books.forEach(b=>{ if(!d.budget.books[b.id]) d.budget.books[b.id] = {total:0, cats:{}}; });

    /* 其余字段 */
    d.goals = d.goals || [];
    d.goals.forEach(g=>{ if(!g.book || !bookIds.includes(g.book)) g.book = d.books[0].id; });
    d.recurring = d.recurring || [];
    d.recurring.forEach(r=>{ if(!r.book || !bookIds.includes(r.book)) r.book = d.books[0].id; });

      if(!c.book || !bookIds.includes(c.book)) c.book = d.books[0].id;
      // 兼容旧结构 {periods?} → 新结构
      if(!c.periods) c.periods = c.type==='w365'?365:(c.type==='d100'?100:52);
      if(!c.per) c.per = c.base||10;
      if(!c.icon) c.icon = c.periods>=365?'📆':(c.periods>=100?'🚀':'🐖');
      if(!c.done || typeof c.done!=='object') c.done = {};
      delete c.type; delete c.base; delete c.startDate; delete c.slots;
    });
    d.chat = d.chat || [];
    d.ach = d.ach || {maxStreak:0, badges:[]};
    d.settings = d.settings || {};
    const s = d.settings;
    if(s.apiKey === undefined) s.apiKey = '';

    s.apiModel = s.apiModel || 'gpt-4o-mini';
    if(s.useAI === undefined) s.useAI = false;
    if(s.humor === undefined) s.humor = true;
    if(!s.remind) s.remind = {on:false, time:'21:00', budget:true, recur:true, last:''};
    d.reports = d.reports || {};

    /* 账目新字段兜底 */
    d.tx.forEach(t=>{
      if(!Array.isArray(t.tags)) t.tags = [];
      if(!Array.isArray(t.attach)) t.attach = [];
      if(!t.syncId) t.syncId = 'tx'+t.id;
      if(!t.updatedAt) t.updatedAt = t.createdAt || Date.now();
      if(!t.scope) t.scope = 'shared';
    });

    /* 情侣版：身份 / 成员 */
    d.settings = d.settings || {};
    d.settings.identity = d.settings.identity || {};
    const id = d.settings.identity;
    if(id.householdId === undefined) id.householdId = '';
    if(id.memberId === undefined) id.memberId = '';
    if(id.inviteCode === undefined) id.inviteCode = '';
    if(id.nickname === undefined) id.nickname = '';
    if(id.emoji === undefined) id.emoji = '🙋';
    if(id.color === undefined) id.color = '#FFB627';
    if(!Array.isArray(d.members)) d.members = [];
    if(!Array.isArray(d.tombstones)) d.tombstones = [];
    if(!d.householdName) d.householdName = '我们的家';
    // 老账目补 owner（取本机身份，否则空）
    d.tx.forEach(t=>{ if(!t.owner) t.owner = id.memberId || ''; });

    return this.attachSave();
  },

  _timer: null,
  /* 500ms 防抖，避免连续操作时反复全量写入 */
  save(immediate){
    if(immediate){
      clearTimeout(this._timer);
      return this._flush();
    }
    clearTimeout(this._timer);
    this._timer = setTimeout(()=> this._flush(), 400);
  },
  _flush(){
    try{ localStorage.setItem(this.key, JSON.stringify(this.data)); }
    catch(e){
      console.warn('保存失败', e);
      const quota = e && (e.name==='QuotaExceededError' || e.code===22);
      if(quota && typeof toast === 'function'){
        toast('💾 存储空间满了！请到设置页清理图片附件');
      }
    }
  },
  /* 兼容 DB.data.save() 调用形式 */
  attachSave(){
    if(this.data && typeof this.data.save !== 'function'){
      Object.defineProperty(this.data, 'save', {
        value: ()=> DB.save(), enumerable:false, writable:true, configurable:true
      });
    }
    return this.data;
  },
  reset(){ localStorage.removeItem(this.key); this.data=null; this.load(); }
};

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function fmtDate(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), da=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${da}`;
}
function todayStr(){ return fmtDate(new Date()); }
function parseDate(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function monthOf(s){ return s.slice(0,7); }
function fmtMoney(n){
  n = Math.round((Number(n)||0)*100)/100;
  if(Number.isInteger(n)) return n.toLocaleString('zh-CN');
  return n.toFixed(2);
}
function catIcon(cat, type){
  const list = DB.data.cats[type==='income'?'income':'expense'];
  const c = list.find(x=>x.name===cat);
  return c ? c.icon : '📦';
}
function catColor(cat, type){
  const list = DB.data.cats[type==='income'?'income':'expense'];
  const c = list.find(x=>x.name===cat);
  return c ? c.color : '#B8A594';
}
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

function txAll(){
  const b = DB.data.curBook;
  const myId = (DB.data.settings.identity||{}).memberId || '';
  const visible = DB.data.tx.filter(t=> t.scope!=='personal' || !t.owner || t.owner===myId);
  if(b === 'all') return visible;
  return visible.filter(t => t.book === b);
}

/* 按 id 取账本 */
function getBook(id){
  return DB.data.books.find(b=>b.id===id) || DB.data.books[0];
}

/* 取某账本的预算对象（读优先，不存在则建） */
function getBudget(bookId){
  bookId = bookId || (DB.data.curBook==='all' ? DB.data.books[0].id : DB.data.curBook);
  if(!DB.data.budget.books) DB.data.budget.books = {};
  if(!DB.data.budget.books[bookId]) DB.data.budget.books[bookId] = {total:0, cats:{}};
  return DB.data.budget.books[bookId];
}

/* 分类统一入口：hideHidden=true 时过滤掉隐藏分类（记账选择器用） */
function catList(type, hideHidden){
  const list = (DB.data.cats[type==='income'?'income':'expense']) || [];
  return hideHidden ? list.filter(c=>!c.hidden) : list;
}

function findCat(name, type){
  return catList(type).find(c=>c.name===name);
}

/* 分类改名：级联更新账目、预算、周期记账、模板 */
function renameCat(oldName, newName, type){
  if(!newName || newName===oldName) return {ok:false, msg:'名称未改变'};
  if(catList(type).some(c=>c.name===newName)) return {ok:false, msg:'已存在同名分类'};
  const cat = findCat(oldName, type);
  if(!cat) return {ok:false, msg:'分类不存在'};
  cat.name = newName;
  // 账目
  DB.data.tx.forEach(t=>{ if(t.category===oldName && t.type===type) t.category = newName; });
  // 各账本预算
  Object.values(DB.data.budget.books||{}).forEach(b=>{
    if(b.cats && Object.prototype.hasOwnProperty.call(b.cats, oldName)){
      b.cats[newName] = b.cats[oldName];
      delete b.cats[oldName];
    }
  });
  // 周期记账
  DB.data.recurring.forEach(r=>{ if(r.category===oldName && r.type===type) r.category = newName; });
  // 模板
  DB.data.templates.forEach(t=>{ if(t.category===oldName && t.type===type) t.category = newName; });
  DB.save(true);
  return {ok:true};
}

/* 删除分类：有账目则迁移到「其他」 */
function deleteCat(name, type){
  const list = DB.data.cats[type==='income'?'income':'expense'];
  const idx = list.findIndex(c=>c.name===name);
  if(idx<0) return {ok:false, msg:'分类不存在'};
  if(list.length<=1) return {ok:false, msg:'至少保留一个分类'};
  const usedCount = DB.data.tx.filter(t=>t.category===name && t.type===type).length;
  // 迁到「其他」
  let fallback = list.find(c=>c.name==='其他' && c.name!==name);
  if(!fallback){
    fallback = {id:'c'+uid(), name:'其他', icon:'📦', color:'#B8A594', hidden:false, words:[]};
    list.push(fallback);
  }
  DB.data.tx.forEach(t=>{ if(t.category===name && t.type===type) t.category = fallback.name; });
  DB.data.recurring.forEach(r=>{ if(r.category===name && r.type===type) r.category = fallback.name; });
  DB.data.templates.forEach(t=>{ if(t.category===name && t.type===type) t.category = fallback.name; });
  Object.values(DB.data.budget.books||{}).forEach(b=>{ if(b.cats) delete b.cats[name]; });
  const realIdx = list.findIndex(c=>c.name===name);
  if(realIdx>=0) list.splice(realIdx,1);
  DB.save(true);
  return {ok:true, migrated:usedCount, to:fallback.name};
}

/* 移动分类顺序 */
function moveCat(name, type, dir){
  const list = DB.data.cats[type==='income'?'income':'expense'];
  const i = list.findIndex(c=>c.name===name);
  if(i<0) return;
  const j = i + dir;
  if(j<0 || j>=list.length) return;
  [list[i], list[j]] = [list[j], list[i]];
  DB.save(true);
}

/* 所有标签（运行时聚合，去重） */
function allTags(){
  const set = new Set();
  DB.data.tx.forEach(t=> (t.tags||[]).forEach(g=>set.add(g)));
  return [...set].sort();
}

/* 当前账本下的标签 */
function tagsOfCurrentBook(){
  const set = new Set();
  txAll().forEach(t=> (t.tags||[]).forEach(g=>set.add(g)));
  return [...set].sort();
}

/* 存储占用（字节） */
function storageSize(){
  try{ return new Blob([JSON.stringify(DB.data)]).size; }catch(e){ return 0; }
}
function fmtSize(bytes){
  if(bytes < 1024) return bytes + ' B';
  if(bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
  return (bytes/1024/1024).toFixed(2) + ' MB';
}

<script>
/* =========================================================
   自然语言解析引擎
   ========================================================= */
const CN_NUM = {'零':0,'一':1,'两':2,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'十':10,'半':0.5};

/* 中文数字转阿拉伯数字 */
function cn2num(s){
  if(/^\d+(\.\d+)?$/.test(s)) return parseFloat(s);
  return parseCnComplex(s);
}

function parseCnComplex(s){
  if(/^\d+(\.\d+)?$/.test(s)) return parseFloat(s);
  if(!s) return NaN;
  const units = {'十':10,'百':100,'千':1000};
  let total=0, cur=0, has=false, lastUnit=0;
  for(const ch of s){
    if(ch==='万'){ total=(total+cur)*10000; cur=0; has=true; }
    else if(units[ch]!==undefined){
      has=true; lastUnit = units[ch];
      if(cur===0) cur=1;
      total += cur*units[ch]; cur=0;
    } else if(CN_NUM[ch]!==undefined && ch!=='半'){
      has=true; cur = CN_NUM[ch];
    } else if(ch==='零'){ has=true; }
    else if(ch==='半'){ has=true; cur = 0.5; }
    else return NaN;
  }
  // "一千二"：末位数字无单位时按上一单位降一级（千→百）
  if(cur && lastUnit>10) return total + cur*(lastUnit/10);
  return has ? (total+cur) : NaN;
}

/* 提取金额列表：[{amt, idx, raw}] */
function extractAmounts(text){
  const out = [];
  // 1) "X块5" / "X块半" 形式（口语：15块5 = 15.5）
  const re0 = /(\d+)\s*(?:块|元)\s*(?:钱)?\s*([1-9]|半)(?![0-9]|元|块|十|百|千|万)/g;
  let m;
  while((m = re0.exec(text))){
    const ji = m[2]==='半' ? 0.5 : parseFloat(m[2])/10;
    out.push({amt: parseFloat(m[1]) + ji, idx:m.index, raw:m[0]});
  }
  // 1b) 中文 "两块五" / "十块五" 形式
  const re0b = /([零一二两三四五六七八九十百千万]+)\s*(?:块|元)\s*([一二两三四五六七八九]|半)(?![零一二两三四五六七八九十百千万]|元|块)/g;
  while((m = re0b.exec(text))){
    const base = parseCnComplex(m[1]);
    if(isNaN(base)) continue;
    const ji = m[2]==='半' ? 0.5 : CN_NUM[m[2]]/10;
    out.push({amt: base + ji, idx:m.index, raw:m[0]});
  }
  // 2) 阿拉伯数字 + 可选单位
  const re1 = /(\d+(?:\.\d+)?)\s*(块钱|块|元|圆|软妹币|人民币|毛|角|分|r|R|¥|￥|k|K|w|W|万)?/g;
  while((m = re1.exec(text))){
    let v = parseFloat(m[1]);
    const u = m[2];
    if(u==='毛'||u==='角') v = v/10;
    else if(u==='分') v = v/100;
    else if(u==='k'||u==='K') v = v*1000;
    else if(u==='w'||u==='W'||u==='万') v = v*10000;
    out.push({amt:v, idx:m.index, raw:m[0]});
  }
  // 3) 中文数字（带单位 或 纯中文数字）
  const re2 = /([零一二两三四五六七八九十百千万]+)\s*(块钱|块|元|圆)?/g;
  while((m = re2.exec(text))){
    const v = parseCnComplex(m[1]);
    if(!isNaN(v) && v>0) out.push({amt:v, idx:m.index, raw:m[0]});
  }
  // 去重：同一起始位置保留最长匹配；并剔除落在已匹配区间内的子匹配
  const byIdx = new Map();
  out.forEach(o=>{
    const cur = byIdx.get(o.idx);
    if(!cur || o.raw.length > cur.raw.length) byIdx.set(o.idx, o);
  });
  let list = [...byIdx.values()].sort((a,b)=>a.idx-b.idx);
  // "X块Y" 复合金额优先级最高，覆盖其内部单数字
  const compound = list.filter(o=>/(块|元)\s*[0-9一二两三四五六七八九半]\s*$/.test(o.raw) && o.raw.length>2);
  list = list.filter(o=>{
    for(const c of compound){
      if(o===c) continue;
      if(o.idx >= c.idx && o.idx < c.idx + c.raw.length) return false;
    }
    return true;
  });
  return list.sort((a,b)=>a.idx-b.idx);
}

/* 根据文本片段判断分类 */
function guessCategory(seg){
  const s = seg.toLowerCase();
  for(const g of KEYWORDS){
    for(const w of g.words){
      if(s.includes(w.toLowerCase())) return g.cat;
    }
  }
  return null;
}

/* 判断是否收入 */
function isIncome(text){
  const s = text.toLowerCase();
  // 出现"花""买""付""支出"等则优先视为支出
  for(const w of INCOME_WORDS){
    if(s.includes(w.toLowerCase())){
      // 排除 "发红包" 这种支出
      if((w==='红包'||w==='礼金') && !/(收到|收了|得到|给我|退回|返)/.test(s)) continue;
      return true;
    }
  }
  return false;
}

/* 主解析：一句话 → 多笔账 */
function parseText(input){
  const text = String(input||'').trim();
  if(!text) return {items:[], income:false};

  const income = isIncome(text);
  let segments = [];
  const marks = extractAmounts(text);

  if(marks.length === 0) return {items:[], income, text};

  // 单笔
  if(marks.length === 1){
    const mk = marks[0];
    // 描述 = 去掉金额后的文字
    let desc = (text.slice(0, mk.idx) + ' ' + text.slice(mk.idx + mk.raw.length)).trim();
    desc = desc.replace(/[，,。、;；:：+＋&和跟与]/g,' ').replace(/\s+/g,' ').trim();
    segments.push({amt:mk.amt, desc, amtIdx:mk.idx});
  } else {
    // 多笔：以金额标记为界切分，前一段归后一个金额
    let prevEnd = 0;
    for(let i=0;i<marks.length;i++){
      const mk = marks[i];
      const segStart = prevEnd;
      const segEnd = mk.idx;
      let desc = text.slice(segStart, segEnd);
      // 若描述为空，尝试从金额后方取一点上下文
      desc = desc.replace(/[，,。、;；:：+＋&和跟与]/g,' ').replace(/\s+/g,' ').trim();
      if(!desc){
        // 向后取下一个分隔符前的文字
        const nextStart = mk.idx + mk.raw.length;
        const nextMk = marks[i+1];
        const endPos = nextMk ? nextMk.idx : text.length;
        desc = text.slice(nextStart, endPos).replace(/[，,。、;；:：+＋&和跟与]/g,' ').trim();
      }
      segments.push({amt:mk.amt, desc, amtIdx:mk.idx});
      prevEnd = mk.idx + mk.raw.length;
    }
  }

  // 生成账目
  const items = [];
  const globalIncome = income && marks.length===1;   // 整句判定只在单笔时生效
  for(const seg of segments){
    if(!(seg.amt>0)) continue;
    const type = (globalIncome || isIncome(seg.desc)) ? 'income' : 'expense';
    let cat = guessCategory(seg.desc);
    if(!cat && type==='expense') cat = guessCategory(text);
    if(!cat) cat = '其他';
    // 收入分类纠正
    if(type==='income'){
      const t = (seg.desc||text);
      if(/工资|薪水|月薪/.test(t)) cat='工资';
      else if(/奖金|年终/.test(t)) cat='奖金';
      else if(/报销/.test(t)) cat='报销';
      else if(/退款|退回|退货/.test(t)) cat='退款';
      else if(/理财|利息|分红|基金|股票/.test(t)) cat='理财';
      else if(/红包|礼金|压岁/.test(t)) cat='红包';
      else if(/兼职|副业|外快|提成/.test(t)) cat='兼职';
      else if(!catList('income').find(c=>c.name===cat)) cat='其他';
    }
    let note = seg.desc.replace(/^\d+(\.\d+)?\s*(块|元|块钱)?\s*/,'').trim();
    note = note || cat;
    items.push({type, amount:Math.round(seg.amt*100)/100, category:cat, note});
  }
  return {items, income};
}

<script>
/* =========================================================
   幽默反馈生成
   ========================================================= */
function timePeriod(){
  const h = new Date().getHours();
  if(h>=5 && h<11) return 'morning';
  if(h>=22 || h<5) return 'night';
  return 'day';
}

function catTotalThisMonth(cat){
  const m = monthOf(todayStr());
  return txAll().filter(t=>t.type==="expense" && t.category===cat && monthOf(t.date)===m)
    .reduce((s,t)=>s+t.amount,0);
}
function monthExpense(){
  const m = monthOf(todayStr());
  return txAll().filter(t=>t.type==='expense' && monthOf(t.date)===m).reduce((s,t)=>s+t.amount,0);
}

/* 生成单笔记账的幽默回复 */
function humorFor(item, ctx){
  ctx = ctx || {};
  const {type, amount, category, note} = item;
  const what = note && note!==category ? note : category;
  const amt = fmtMoney(amount);

  if(DB.data.settings.humor === false){
    return type==='income' ? `已记录收入：${what} +${amt}元` : `已记录：${what} -${amt}元`;
  }

  // 收入
  if(type==='income'){
    let t = pick(HUMOR.loan.concat(HUMOR.income));
    return t.replace(/{what}/g,what).replace(/{amt}/g,amt);
  }

  // 大额 / 小额
  if(amount >= 1000) return pick(HUMOR.big).replace(/{what}/g,what).replace(/{amt}/g,amt);
  if(amount <= 5 && amount>0) return pick(HUMOR.tiny).replace(/{what}/g,what).replace(/{amt}/g,amt);

  // 时段特殊
  const tp = timePeriod();
  if(tp==='night' && Math.random()<0.42){
    return pick(HUMOR.night).replace(/{what}/g,what).replace(/{amt}/g,amt);
  }

  const pool = HUMOR.byCat[category] || HUMOR.byCat['其他'];
  let t = pick(pool);
  let msg = t.replace(/{what}/g,what).replace(/{amt}/g,amt);

  // 附加观点：分类累计提醒（30%概率）
  if(Math.random()<0.3){
    const tot = catTotalThisMonth(category);
    if(tot>0 && tot !== amount){
      const extras = [
        `\n（本月「${category}」已累计 ${fmtMoney(tot)} 元啦 👀）`,
        `\n本月${category}花了 ${fmtMoney(tot)} 元，心里有数哦 📊`,
        `\n📌 ${category} 本月合计 ${fmtMoney(tot)} 元`
      ];
      msg += pick(extras);
    }
  }
  // 预算预警
  const bw = budgetWarningText(category, amount);
  if(bw) msg += '\n' + bw;
  return msg;
}

/* 预算预警文案 */
function budgetWarningText(cat, justAdded){
  const b = DB.data.budget;
  if(!b || !b.total) return '';
  const used = monthExpense();
  const pct = used / b.total * 100;
  if(pct >= 100) return `🚨 警告！本月预算 ${fmtMoney(b.total)} 元已超支，当前花了 ${fmtMoney(used)} 元，钱包已阵亡 💀`;
  if(pct >= 85 && justAdded) return `⚠️ 本月预算已用 ${pct.toFixed(0)}%，只剩 ${fmtMoney(b.total-used)} 元了，且花且珍惜 🥺`;
  const cab = b.cats && b.cats[cat];
  if(cab){
    const cu = catTotalThisMonth(cat);
    const cp = cu / cab * 100;
    if(cp >= 100) return `📛 「${cat}」分类预算超了！花了 ${fmtMoney(cu)} / 预算 ${fmtMoney(cab)} 元`;
    if(cp >= 85) return `⚠️ 「${cat}」已用 ${cp.toFixed(0)}%，快见底了`;
  }
  return '';
}

/* 多笔回复 */
function humorForMulti(items){
  const total = items.reduce((s,i)=>s+(i.type==='expense'?i.amount:0),0);
  let msg = pick(HUMOR.multi).replace(/{n}/g,items.length).replace(/{total}/g,fmtMoney(total));
  const cats = [...new Set(items.map(i=>i.category))];
  if(cats.length>1) msg += `\n涉及：${cats.join('、')}`;
  return msg;
}

/* =========================================================
   大模型 API（可选）
   ========================================================= */
async function askLLM(userText){
  const s = DB.data.settings;
  if(!s.useAI || !s.apiKey) return null;
  const system = `你是「小钱袋」记账App的幽默记账助手。用户会用自然语言说花钱/赚钱的事。
你的任务：
1. 从用户话中提取所有账目，每笔包含：type(expense/income)、amount(数字)、category、note(简短描述)
2. category 只能从这些里选：支出[${catList('expense').map(c=>c.name).join('/')}]，收入[${catList('income').map(c=>c.name).join('/')}]
3. 用可爱、幽默、俏皮的中文回复（可带适量emoji），别太长，2-3句
4. 必须严格返回JSON，格式：{"reply":"幽默回复文本","items":[{"type":"expense","amount":18,"category":"奶茶","note":"下午茶"}]}
只返回JSON，不要其他内容。`;
  const res = await fetch(s.apiUrl, {
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+s.apiKey},
    body:JSON.stringify({
      model:s.apiModel || 'gpt-4o-mini',
      messages:[{role:'system',content:system},{role:'user',content:userText}],
      temperature:0.9
    })
  });
  if(!res.ok) throw new Error('API 请求失败 '+res.status);
  const j = await res.json();
  let txt = j.choices?.[0]?.message?.content || '';
  txt = txt.replace(/```json|```/g,'').trim();
  const s0 = txt.indexOf('{'), e0 = txt.lastIndexOf('}');
  if(s0>=0 && e0>s0) txt = txt.slice(s0, e0+1);
  return JSON.parse(txt);
}

/* 智能问答（本地） */
function localQA(q){
  const ql = q.toLowerCase();
  const isQuery = /多少|几笔|花|消费|统计|查|看|合计|一共|总共|\?|？/.test(q);
  const isRecord = /记一笔|记账|花了|付了|买了|花了钱/.test(q) && extractAmounts(q).length>0;
  if(!isQuery || isRecord) return null;

  // 时间范围
  const now = new Date();
  let from, to, rangeName='';
  if(/今天|今日/.test(q)){ from=to=todayStr(); rangeName='今天'; }
  else if(/昨天/.test(q)){ const d=new Date(now); d.setDate(d.getDate()-1); from=to=fmtDate(d); rangeName='昨天'; }
  else if(/本周|这周|这个星期/.test(q)){ const d=new Date(now); const day=(d.getDay()+6)%7; d.setDate(d.getDate()-day); from=fmtDate(d); to=todayStr(); rangeName='本周'; }
  else if(/上周/.test(q)){ const d=new Date(now); const day=(d.getDay()+6)%7; d.setDate(d.getDate()-day-7); from=fmtDate(d); const d2=new Date(d); d2.setDate(d2.getDate()+6); to=fmtDate(d2); rangeName='上周'; }
  else if(/上个月|上月/.test(q)){ const d=new Date(now.getFullYear(),now.getMonth()-1,1); from=fmtDate(d); to=fmtDate(new Date(now.getFullYear(),now.getMonth(),0)); rangeName='上个月'; }
  else if(/这个月|本月|这月/.test(q)){ const d=new Date(now.getFullYear(),now.getMonth(),1); from=fmtDate(d); to=fmtDate(now); rangeName='本月'; }
  else { const d=new Date(now.getFullYear(),now.getMonth(),1); from=fmtDate(d); to=todayStr(); rangeName='本月'; }

  // 分类
  let cat=null;
  for(const g of KEYWORDS){ if(g.words.some(w=>ql.includes(w.toLowerCase()))){ cat=g.cat; break; } }
  // 直接匹配分类名
  if(!cat){ for(const c of catList('expense')){ if(ql.includes(c.name)){ cat=c.name; break; } } }

  let list = txAll().filter(t=>t.date>=from && t.date<=to);
  if(cat) list = list.filter(t=>t.category===cat);
  if(/收入|赚|进账/.test(ql)) list = list.filter(t=>t.type==='income');
  else if(/支出|花|消费/.test(ql)) list = list.filter(t=>t.type==='expense');

  const total = list.reduce((s,t)=>s+t.amount,0);
  const label = (cat?cat+'：':'') + (rangeName||'');
  if(list.length===0) return `${label}没找到相关记录呢，是不是还没记呀？🤔`;
  const avg = total/list.length;
  let extra='';
  if(list.length>=3) extra = `\n平均每笔 ${fmtMoney(avg)} 元，共 ${list.length} 笔记录 📝`;

function go(page){
  state.page = page;
  document.getElementById('topbarSub').textContent = SUBTITLES[page]||'';
  document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active', p.id==='page-'+page));
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active', n.dataset.go===page));
  renderPage(page);
  document.getElementById('content').scrollTop = 0;
}

function openDrawer(){ document.getElementById('drawer').classList.add('show'); document.getElementById('scrim').classList.add('show'); }
function closeDrawer(){ document.getElementById('drawer').classList.remove('show'); document.getElementById('scrim').classList.remove('show'); }

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove('show'), 2100);
}

function flyCoins(n){
  n = n||5;
  for(let i=0;i<n;i++){
    const el = document.createElement('div');
    el.className='coin-fly';
    el.textContent = pick(['🪙','💰','🧧','✨','💵']);
    el.style.left = (window.innerWidth/2 + (Math.random()*160-80)) + 'px';
    el.style.top = (window.innerHeight - 180) + 'px';
    el.style.animationDelay = (i*70)+'ms';
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 1500);
  }
}

/* 页面渲染分发 */
function renderPage(page){
  const el = document.getElementById('page-'+page);
  if(!el) return;
  const R = {
    home:renderHome, chat:renderChat, list:renderList, tpl:renderTpl, stats:renderStats,
    cal:renderCal, budget:renderBudget, goals:renderGoals, challenge:renderChallenge,
    recur:renderRecur, report:renderReport, ach:renderAch, cats:renderCats,
    family:renderFamily, onboard:renderOnboard, set:renderSet
  }[page];
  if(R) R(el);
}

/* 数据工具 */
function txSorted(){ return [...txAll()].sort((a,b)=> b.date.localeCompare(a.date) || (b.createdAt||0)-(a.createdAt||0)); }
function sumRange(from,to,type){
  return txAll().filter(t=>t.date>=from && t.date<=to && (!type||t.type===type)).reduce((s,t)=>s+t.amount,0);
}
function monthRange(){
  const n = new Date();
  return [fmtDate(new Date(n.getFullYear(),n.getMonth(),1)), fmtDate(new Date(n.getFullYear(),n.getMonth()+1,0))];
}

/* 账目行 */
function txRow(t){
  const inc = t.type==='income';
  const linked = isSyncOn();
  const m = linked && t.owner ? memberById(t.owner) : null;
  const mine = m && m.id===me().memberId;
  const ownerTag = !linked ? '' :
    (t.scope==='personal' ? `<span class="who-tag" style="background:rgba(184,165,148,.18);color:#8B7A68">🔒 我的私账</span>`
      : `<span class="who-tag" style="background:${m.color}22;color:${m.color}">${m.emoji} ${esc(m.nickname)}</span>`);
  const attN = (t.attach||[]).length;
  return `<div class="tx" data-txid="${t.id}">
    <div class="tx-icon" style="background:${catColor(t.category,t.type)}22">${catIcon(t.category,t.type)}</div>
    <div class="tx-mid">
      <b>${esc(t.note||t.category)}${attN?`<span class="tx-attach-dot">📎${attN}</span>`:''}</b>
      <span>${esc(t.category)} · ${t.date.slice(5)}</span>
      ${ownerTag?`<div style="margin-top:4px">${ownerTag}</div>`:''}
    </div>
    <div class="tx-amt ${inc?'inc':'exp'}">${inc?'+':'-'}${fmtMoney(t.amount)}</div>
  </div>`;
}
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function bindCommon(el){
  el.querySelectorAll('[data-go]').forEach(b=> b.onclick=()=>{ go(b.dataset.go); closeDrawer(); });
  el.querySelectorAll('[data-quick]').forEach(b=> b.onclick=()=> openSheet('add', {category:b.dataset.quick, type:'expense'}));
  el.querySelectorAll('[data-txid]').forEach(b=> b.onclick=()=> showTxDetail(b.dataset.txid));
  el.querySelectorAll('[data-usetpl]').forEach(b=> b.onclick=()=> useTemplate(b.dataset.usetpl));
}

/* 一键套用速记模板：金额可直接确认或修改 */
function useTemplate(id){
  const t = DB.data.templates.find(x=>x.id===id);
  if(!t) return toast('模板不存在');
  openSheet('add', {category:t.category, type:t.type, amount:t.amount, note:t.note||t.name, book:t.book, tags:t.tags||[]});
  toast(`⚡ 已套用「${t.name}」，确认一下金额～`);
}

/* =========================================================
   小助手
   ========================================================= */
function renderChat(el){
  const msgs = DB.data.chat;
  el.innerHTML = `
  <div class="chat-wrap">
    <div class="chat-body" id="chatBody"></div>
    <div class="chat-foot">
      <div class="chat-suggest">
        ${['奶茶18块','早餐15 午餐30','打车32元','发工资8000','这个月奶茶花了多少','今天花了多少钱'].map(s=>`<button class="chip" data-say="${s}">${s}</button>`).join('')}
      </div>
      <div class="chat-input-row">
        <button class="mic-btn" id="micBtn" title="语音输入">🎤</button>
        <textarea class="chat-input" id="chatInput" rows="1" placeholder="跟我说说你花了什么…"></textarea>
        <button class="send-btn" id="sendBtn">➤</button>
      </div>
    </div>
  </div>`;

  const body = document.getElementById('chatBody');
  if(msgs.length===0){
    DB.data.chat.push({role:'bot', text:'嗨！我是你的小钱袋管家 👛\n\n直接跟我说你花了多少、干了啥就行，比如：\n「奶茶18块」\n「早餐15 午餐30 打车20」\n「发工资8000」\n\n我不仅帮你记账，还会……点评你一下 😏', ts:Date.now()});
    DB.save(true);
  }
  msgs.forEach(m=> body.appendChild(msgNode(m)));
  body.scrollTop = body.scrollHeight;

  const input = document.getElementById('chatInput');
  const send = ()=>{
    const v = input.value.trim();
    if(!v) return;
    input.value=''; input.style.height='auto';
    handleUserSay(v);
  };
  document.getElementById('sendBtn').onclick = send;
  input.onkeydown = e=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send(); } };
  input.oninput = ()=>{ input.style.height='auto'; input.style.height=Math.min(input.scrollHeight,96)+'px'; };
  el.querySelectorAll('[data-say]').forEach(b=> b.onclick=()=> handleUserSay(b.dataset.say));

  // 语音输入
  const mic = document.getElementById('micBtn');
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ mic.style.opacity='.45'; mic.onclick=()=>toast('当前浏览器不支持语音，试试打字吧～'); }
  else{
    mic.onclick = ()=>{
      const r = new SR();
      r.lang='zh-CN'; r.interimResults=false;
      mic.classList.add('rec');
      r.onresult = ev=>{ const t = ev.results[0][0].transcript; input.value = t; send(); };
      r.onerror = ()=> toast('没听清，再说一次？');
      r.onend = ()=> mic.classList.remove('rec');
      r.start();
      toast('🎤 正在听…说吧');
    };
  }
}

function msgNode(m){
  const div = document.createElement('div');
  div.className = 'msg ' + (m.role==='me'?'me':'bot');
  let inner = `<div class="avatar">${m.role==='me'?'🙋':'👛'}</div><div class="bubble">${esc(m.text).replace(/\n/g,'<br>')}`;
  if(m.items && m.items.length){
    inner += m.items.map(it=>`
      <div class="txcard">
        <div class="tc-l">${catIcon(it.category,it.type)} <span>${esc(it.note||it.category)} · ${esc(it.category)}</span></div>
        <div class="tc-amt" style="${it.type==='income'?'color:var(--green)':''}">${it.type==='income'?'+':'-'}¥${fmtMoney(it.amount)}</div>
      </div>`).join('');
  }
  inner += `</div>`;
  div.innerHTML = inner;
  return div;
}

function pushChat(m){
  DB.data.chat.push(m);
  if(DB.data.chat.length>200) DB.data.chat = DB.data.chat.slice(-200);
  DB.save(true);
  const body = document.getElementById('chatBody');
  if(!body) return;
  body.appendChild(msgNode(m));
  body.scrollTop = body.scrollHeight;
}

function showTyping(){
  const body = document.getElementById('chatBody');
  if(!body) return;
  const d = document.createElement('div');
  d.className='msg bot'; d.id='typingMsg';
  d.innerHTML = `<div class="avatar">👛</div><div class="bubble"><div class="typing"><i></i><i></i><i></i></div></div>`;
  body.appendChild(d); body.scrollTop = body.scrollHeight;
}
function hideTyping(){ const e=document.getElementById('typingMsg'); if(e) e.remove(); }

async function handleUserSay(text){
  pushChat({role:'me', text, ts:Date.now()});
  showTyping();

  // 1) 先试 AI（若开启）
  if(DB.data.settings.useAI && DB.data.settings.apiKey){
    try{
      const ai = await askLLM(text);
      hideTyping();
      if(ai && ai.items && ai.items.length){
        addItems(ai.items, {silent:true});
        pushChat({role:'bot', text:ai.reply || '已帮你记好啦 👛', items:ai.items, ts:Date.now()});
        flyCoins(4);
        refreshIfNeeded();
        return;
      }
      if(ai && ai.reply){ pushChat({role:'bot', text:ai.reply, ts:Date.now()}); return; }
    }catch(e){
      hideTyping();
      pushChat({role:'bot', text:`😅 AI 有点小状况（${e.message}），我用本地引擎帮你记：`, ts:Date.now()});
      showTyping();
    }
  }

  // 2) 本地引擎
  setTimeout(()=>{
    hideTyping();
    // 先判断是否在提问
    const qa = localQA(text);
    const parsed = parseText(text);

    if(parsed.items.length===0){
      if(qa){ pushChat({role:'bot', text:qa, ts:Date.now()}); }
      else{
        pushChat({role:'bot', text:pick([
          '咦？我没听出金额呢 🤔 试试「奶茶18块」这样说～',
          '抱歉，我有点懵 😵 请告诉我花了多少钱、干了啥，比如「打车32元」',
          '没抓到金额哦～ 你可以说「午餐30块」或者「发工资8000」💰'
        ]), ts:Date.now()});
      }
      return;
    }

    // 记账
    addItems(parsed.items, {silent:true});
    let reply;
    if(parsed.items.length===1){
      reply = humorFor(parsed.items[0]);
    }else{
      reply = humorForMulti(parsed.items) + '\n\n' + parsed.items.map(i=>`${catIcon(i.category,i.type)} ${i.note} ¥${fmtMoney(i.amount)}`).join('\n');
    }
    pushChat({role:'bot', text:reply, items:parsed.items, ts:Date.now()});
    flyCoins(Math.min(parsed.items.length+2,7));
    toast('✅ 已记账');
    refreshIfNeeded();
  }, 380);
}

/* 写入账目 */
function addItems(items, opt){
  opt = opt||{};
  const date = opt.date || todayStr();
  const book = opt.book || (DB.data.curBook==='all' ? DB.data.books[0].id : DB.data.curBook);
  const myId = me().memberId || '';
  const created = [];
  items.forEach(it=>{
    const t = {
      id:uid(), type:it.type==='income'?'income':'expense',
      amount:Math.round(Number(it.amount)*100)/100,
      category:it.category || '其他',
      note:it.note || it.category || '记一笔',
      date, createdAt:Date.now(),
      book, tags: it.tags||[], attach: it.attach||[],
      owner: it.owner || myId,
      scope: it.scope || opt.scope || 'shared'
    };
    t.syncId = 'tx'+t.id;
    t.updatedAt = t.createdAt;
    DB.data.tx.push(t); created.push(t);
  });
  DB.save(true);
  checkAchievements();
  // 触发同步
  if(isSyncOn() && created.some(t=>t.scope!=='personal')){
    setTimeout(()=> doSync(true), 300);
  }
  return created;
}

/* 图片压缩：最长边 800px，JPEG 0.6；超 100KB 降到 0.45 */
function compressImage(file, maxSide, quality){
  maxSide = maxSide || 800;
  quality = quality || 0.6;
  return new Promise((resolve, reject)=>{
    const rd = new FileReader();
    rd.onerror = ()=> reject(new Error('读取失败'));
    rd.onload = ()=>{
      const img = new Image();
      img.onerror = ()=> reject(new Error('图片格式不支持'));
      img.onload = ()=>{
        let {width:w, height:h} = img;
        const scale = Math.min(1, maxSide/Math.max(w,h));
        w = Math.round(w*scale); h = Math.round(h*scale);
        const cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        const ctx = cv.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0,0,w,h);
        ctx.drawImage(img, 0, 0, w, h);
        let src = cv.toDataURL('image/jpeg', quality);
        // 仍偏大则二次压缩
        if(src.length > 100*1024){
          src = cv.toDataURL('image/jpeg', 0.45);
        }
        resolve({id:uid(), w, h, src});
      };
      img.src = rd.result;
    };
    rd.readAsDataURL(file);
  });
}

/* 压缩后的体积（近似，用于提示） */
function dataUrlSize(src){
  const i = src.indexOf(',');
  return i<0 ? src.length : Math.round((src.length-i-1) * 3/4);
}

  const t = todayStr();
  const y = new Date(); y.setDate(y.getDate()-1);
  if(d===t) return '今天 · '+d.slice(5);
  if(d===fmtDate(y)) return '昨天 · '+d.slice(5);

  const w = ['周日','周一','周二','周三','周四','周五','周六'][dd.getDay()];
  return `${d.slice(5)} ${w}`;
}

/* 手写 SVG 饼图 */
function pieSVG(arr, total){
  const size=126, r=52, cx=63, cy=63;
  let a0 = -Math.PI/2, paths='';
  arr.forEach(c=>{
    const frac = c.val/total;
    const a1 = a0 + frac*Math.PI*2;
    const x0 = cx + r*Math.cos(a0), y0 = cy + r*Math.sin(a0);
    const x1 = cx + r*Math.cos(a1), y1 = cy + r*Math.sin(a1);
    const large = frac>0.5?1:0;
    if(frac>=0.9999){
      paths += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${c.color}"/>`;
    }else{
      paths += `<path d="M${cx},${cy} L${x0.toFixed(2)},${y0.toFixed(2)} A${r},${r} 0 ${large} 1 ${x1.toFixed(2)},${y1.toFixed(2)} Z" fill="${c.color}"/>`;
    }
    a0 = a1;
  });
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    ${paths}
    <circle cx="${cx}" cy="${cy}" r="31" fill="#fff"/>
    <text x="${cx}" y="${cy-3}" text-anchor="middle" font-size="10" fill="#B8A594" font-weight="700">总支出</text>
    <text x="${cx}" y="${cy+13}" text-anchor="middle" font-size="14" fill="#4A3728" font-weight="900">¥${fmtMoney(total).replace(/,/g,'')}</text>
  </svg>`;
}

/* 趋势柱状图 */
function trendChart(range, from, to){
  const buckets = {};
  let keys = [];
  if(range==='year'){
    for(let m=0;m<12;m++){ const k=String(m+1); buckets[k]=0; keys.push(k); }
    txAll().filter(t=>t.type==='expense'&&t.date.startsWith(from.slice(0,4))).forEach(t=>{
      const k = String(parseInt(t.date.slice(5,7))); buckets[k]=(buckets[k]||0)+t.amount;
    });
  }else{
    const f = parseDate(from), t2 = parseDate(to);
    const days = Math.round((t2-f)/86400000)+1;
    const cap = Math.min(days, 31);
    for(let i=0;i<cap;i++){
      const d = new Date(f); d.setDate(d.getDate()+i);
      const k = String(d.getDate()); buckets[k]=0; keys.push(k);
      txAll().filter(t=>t.type==='expense'&&t.date===fmtDate(d)).forEach(t=> buckets[k]+=t.amount);
    }
  }
  const max = Math.max(...Object.values(buckets), 1);
  const showEvery = keys.length>16 ? Math.ceil(keys.length/10) : 1;
  return `<div class="bars">
    ${keys.map((k,i)=>{
      const v = buckets[k]||0;
      const h = Math.max(v/max*100, 0);
      const isTop = v===max && v>0;
      const lab = range==='year' ? k+'月' : k;
      return `<div class="bcol ${isTop?'bl':''}">
        <span class="bv">${v>0&&(keys.length<=12||isTop)?fmtMoney(v):''}</span>
        <div class="bar-v" style="height:${h}%"></div>
        <span class="bl-lab">${(i%showEvery===0)?lab:''}</span>
      </div>`;
    }).join('')}
  </div>`;
}
