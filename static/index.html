    cells.push(`<div class="cal-d out"><span class="cd-num">${prevDays-startDow+i+1}</span></div>`);
  }
  for(let d=1;d<=daysInMonth;d++){
    const ds = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const v = dayExp[ds]||0;
    const ratio = v/max;
    let lv = '';
    if(v>0){ lv = ratio>=0.8?'lv5':ratio>=0.6?'lv4':ratio>=0.4?'lv3':ratio>=0.2?'lv2':'lv1'; }
    const isToday = ds===todayStr();
    cells.push(`<div class="cal-d ${lv} ${isToday?'today':''}" data-day="${ds}">
      <span class="cd-num">${d}</span>
      ${v>0?`<span class="cd-amt">${v>=1000?(v/1000).toFixed(1)+'k':Math.round(v)}</span>`:''}
    </div>`);
  }
  // 补齐
  const rest = (7 - cells.length%7)%7;
  for(let i=0;i<rest;i++) cells.push(`<div class="cal-d out"><span class="cd-num">${i+1}</span></div>`);

  el.innerHTML = `
    <div class="cal-nav">
      <button class="icon-btn" id="prevM" style="background:var(--cream-2);color:var(--ink-2)">‹</button>
      <b>${y} 年 ${m+1} 月</b>
      <button class="icon-btn" id="nextM" style="background:var(--cream-2);color:var(--ink-2)">›</button>
    </div>

    <div class="stat-grid">
      <div class="stat-card"><span class="sc-icon">💸</span><b class="c-red">${fmtMoney(monthTotal)}</b><span>本月支出</span></div>
      <div class="stat-card"><span class="sc-icon">📅</span><b class="c-gold">${daysWithTx}</b><span>记账天数</span></div>
      <div class="stat-card"><span class="sc-icon">📊</span><b class="c-mint">${fmtMoney(avg)}</b><span>日均</span></div>
    </div>

    <div class="card">
      <div class="cal-grid">
        ${['一','二','三','四','五','六','日'].map(d=>`<div class="cal-h">${d}</div>`).join('')}
        ${cells.join('')}
      </div>
      <div class="cal-legend">
        <span>少</span>
        <i style="background:#FFF3D6"></i><i style="background:#FFE3A8"></i>
        <i style="background:#FFCE6B"></i><i style="background:#FFB627"></i>
        <i style="background:#F08A1E"></i>
        <span>多</span>
      </div>
    </div>

    <div class="sec-title">当日明细</div>
    <div class="card" id="calDetail">
      <div class="empty"><span class="e-icon">👆</span><p>点日历上的某一天<br>看看那天花了啥</p></div>
    </div>
  `;

  document.getElementById('prevM').onclick = ()=>{
    let mm = m-1, yy=y; if(mm<0){mm=11;yy--;}
    state.calMonth=mm; state.calYear=yy; renderCal(el);
  };
  document.getElementById('nextM').onclick = ()=>{
    let mm = m+1, yy=y; if(mm>11){mm=0;yy++;}
    state.calMonth=mm; state.calYear=yy; renderCal(el);
  };
  el.querySelectorAll('[data-day]').forEach(c=> c.onclick = ()=>{
    el.querySelectorAll('[data-day]').forEach(x=> x.style.borderColor='transparent');
    c.style.borderColor='var(--gold)';
    const ds = c.dataset.day;
    const items = txSorted().filter(t=>t.date===ds);
    document.getElementById('calDetail').innerHTML = items.length
      ? items.map(txRow).join('')
      : `<div class="empty"><span class="e-icon">🌿</span><p>${ds.slice(5)} 这天没有记录～</p></div>`;
    bindCommon(el);
  });
}

/* =========================================================
   预算管理
   ========================================================= */
function renderBudget(el){
  const bk = getBook(DB.data.curBook==='all' ? DB.data.books[0].id : DB.data.curBook);
  const b = getBudget();
  const [f,t] = monthRange();
  const used = sumRange(f,t,'expense');
  const totalPct = b.total? Math.min(used/b.total*100,999):0;
  const cls = totalPct>=100?'over':(totalPct>=85?'warn':'');
  const daysLeft = Math.max(1, Math.ceil((parseDate(t)-new Date())/86400000)+1);

  const catRows = catList('expense').map(c=>{
    const cb = (b.cats&&b.cats[c.name])||0;
    const cu = catTotalThisMonth(c.name);
    if(!cb && !cu) return '';
    const p = cb? cu/cb*100 : 0;
    const k = p>=100?'over':(p>=85?'warn':'');
    return `<div class="rank-item">
      <div class="rk-mid">
        <div class="rk-top"><span>${c.icon} ${c.name}</span>
          <span class="rk-pct">${fmtMoney(cu)}${cb?' / '+fmtMoney(cb):''}${cb?' · '+p.toFixed(0)+'%':''}</span></div>
        <div class="bar ${k}"><i style="width:${cb?Math.min(p,100):(cu?100:0)}%"></i></div>
      </div>
    </div>`;
  }).filter(Boolean).join('');

  el.innerHTML = `
    <div class="hero" style="background:linear-gradient(135deg,#7FE3DC,#4ECDC4,#2FB3A9)">
      <div class="h-label">🎯 本月总预算 · ${bk.icon} ${esc(bk.name)}</div>
      <div class="h-amount"><small>¥</small>${fmtMoney(b.total||0)}</div>
      <div class="h-sub">已花 ¥${fmtMoney(used)} · 剩余 ¥${fmtMoney(Math.max((b.total||0)-used,0))}</div>
      <div class="h-row">
        <div class="h-pill"><b>${totalPct.toFixed(0)}%</b><span>已使用</span></div>
        <div class="h-pill"><b>${daysLeft} 天</b><span>本月剩余</span></div>
      </div>
    </div>

    ${DB.data.curBook==='all' ? `<div class="card" style="background:#FFF4E0;border:none">
      <p style="font-size:12px;font-weight:700;color:var(--ink-2);line-height:1.6">
        💡 当前是「全部账本」视图，预算显示的是「${esc(bk.name)}」的配置。切到具体账本可单独设置预算。
      </p></div>` : ''}

    <div class="card">
      <div class="card-t"><h3>📈 预算进度</h3></div>
      <div class="bar ${cls}" style="height:14px"><i style="width:${Math.min(totalPct,100)}%"></i></div>
      <div style="margin-top:11px;font-size:13px;font-weight:700;color:${totalPct>=100?'#E8413C':totalPct>=85?'#F59200':'var(--ink-2)'}">
        ${!b.total?'还没有设置总预算哦，先设一个吧 👇':
          totalPct>=100?`🚨 已超支 ${fmtMoney(used-b.total)} 元！小钱袋的警报都响了 💀`:
          totalPct>=85?`⚠️ 只剩 ${fmtMoney(b.total-used)} 元了，接下来 ${daysLeft} 天要省着花 🥺`:
          `👍 还剩 ${fmtMoney(b.total-used)} 元，日均可用 ${fmtMoney((b.total-used)/daysLeft)} 元`}
      </div>
      ${b.total?`<div style="margin-top:11px;font-size:12px;color:var(--ink-3);font-weight:600">按当前速度，本月预计支出 ¥${fmtMoney(used/Math.max(1,(new Date().getDate()))*new Date(parseDate(t).getFullYear(), parseDate(t).getMonth()+1,0).getDate())}</div>`:''}
    </div>

    <div class="card">
      <div class="card-t"><h3>⚙️ 设置总预算</h3></div>
      <div style="display:flex;gap:9px;align-items:center">
        <input class="input" id="budTotal" type="number" inputmode="decimal" placeholder="如 6000" value="${b.total||''}" style="flex:1">
        <button class="btn" id="saveBud">保存</button>
      </div>
      <div class="chips" style="margin-top:11px">
        ${[2000,3000,5000,8000,10000].map(v=>`<button class="chip" data-bq="${v}">¥${v}</button>`).join('')}
      </div>
    </div>

    <div class="card">
      <div class="card-t"><h3>🍱 分类预算</h3><span class="more">点分类设置</span></div>
      ${catRows || '<div class="empty"><span class="e-icon">📦</span><p>还没有分类预算<br>先记几笔账再来设置吧</p></div>'}
    </div>

    <div class="card">
      <div class="card-t"><h3>💰 分类预算设置</h3></div>
      <div class="chips">
        ${catList('expense').map(c=>{
          const v = (b.cats&&b.cats[c.name])||'';
          return `<button class="chip ${v?'on':''}" data-bcat="${c.name}">${c.icon}${c.name}${v?' ¥'+v:''}</button>`;
        }).join('')}
      </div>
      <p style="font-size:11.5px;color:var(--ink-3);font-weight:600;margin-top:10px">点击分类即可设置或修改该分类的月度预算 ✏️</p>
    </div>
  `;

  document.getElementById('saveBud').onclick = ()=>{
    const v = parseFloat(document.getElementById('budTotal').value);
    if(isNaN(v)||v<0) return toast('请输入有效金额');
    b.total = v; DB.save(true);
    toast('✅ 总预算已更新'); flyCoins(3); renderBudget(el);
  };
  el.querySelectorAll('[data-bq]').forEach(b2=> b2.onclick=()=>{ document.getElementById('budTotal').value=b2.dataset.bq; });
  el.querySelectorAll('[data-bcat]').forEach(b2=> b2.onclick=()=>{
    const name = b2.dataset.bcat;
    const cur = (b.cats&&b.cats[name])||'';
    openPrompt('设置「'+name+'」月预算', cur, (val)=>{
      b.cats = b.cats||{};
      if(val===''||val===null) delete b.cats[name];
      else b.cats[name] = parseFloat(val)||0;
      DB.save(true); renderBudget(el); toast('✅ 已更新');
    }, 'number');
  });
}

/* =========================================================
   存钱目标
   ========================================================= */
function renderGoals(el){
  const goals = DB.data.curBook==='all'
    ? DB.data.goals
    : DB.data.goals.filter(g=>g.book===DB.data.curBook);
  const totalSaved = goals.reduce((s,g)=>s+g.saved,0);
  const totalTarget = goals.reduce((s,g)=>s+g.target,0);
  const bk = getBook(DB.data.curBook==='all' ? DB.data.books[0].id : DB.data.curBook);

  el.innerHTML = `
    <div class="hero" style="background:linear-gradient(135deg,#FFB0D0,#FF9EC4,#F4739F)">
      <div class="h-label">🐷 小猪存钱罐 · ${DB.data.curBook==='all'?'全部账本':bk.icon+' '+esc(bk.name)}</div>
      <div class="h-amount"><small>¥</small>${fmtMoney(totalSaved)}</div>
      <div class="h-sub">${goals.length} 个目标 · 总目标 ¥${fmtMoney(totalTarget)}</div>
      <div class="h-row">
        <div class="h-pill"><b>${totalTarget?(totalSaved/totalTarget*100).toFixed(0):0}%</b><span>总进度</span></div>
        <div class="h-pill"><b>¥${fmtMoney(Math.max(totalTarget-totalSaved,0))}</b><span>还差</span></div>
      </div>
    </div>

    <button class="btn block" id="addGoal">➕ 新建存钱目标</button>
    <div style="height:13px"></div>

    ${goals.length? goals.map(g=>{
      const p = Math.min(g.saved/g.target*100, 100);
      const done = g.saved>=g.target;
      const tip = done? '🎉 目标达成！你太棒了！' :
        p>=75? '🐷 小猪快装满了，再加把劲！' :
        p>=50? '👍 过半啦，坚持住！' :
        p>=25? '🌱 稳步前进中～' : '💪 积少成多，从今天开始！';
      return `<div class="goal-card">
        <div class="goal-head">
          <div class="goal-ico">${g.icon||'🎯'}</div>
          <div class="gh-mid">
            <b>${esc(g.name)}</b>
            <span>${g.deadline?'目标日期 '+g.deadline:'没有期限，慢慢攒'}</span>
          </div>
          <button class="tx-del" data-delgoal="${g.id}">🗑</button>
        </div>
        <div class="goal-amt"><span>已存 <b>¥${fmtMoney(g.saved)}</b></span><span>目标 ¥${fmtMoney(g.target)}</span></div>
        <div class="bar ${done?'':(p>=75?'':'')}" style="height:13px"><i style="width:${p}%"></i></div>
        <div style="font-size:12px;font-weight:700;color:var(--ink-2);margin-top:8px">${tip}（${p.toFixed(0)}%）</div>
        <div class="goal-actions">
          <button class="btn sm" style="flex:1" data-savein="${g.id}">💰 存入</button>
          <button class="btn sm ghost" style="flex:1" data-editgoal="${g.id}">✏️ 编辑</button>
        </div>
      </div>`;
    }).join('') : `<div class="empty"><span class="e-icon">🐷</span><p>还没有存钱目标<br>给自己定个小目标吧～</p></div>`}
  `;

  document.getElementById('addGoal').onclick = ()=> editGoal(null, el);
  el.querySelectorAll('[data-editgoal]').forEach(b=> b.onclick=()=> editGoal(b.dataset.editgoal, el));
  el.querySelectorAll('[data-delgoal]').forEach(b=> b.onclick=()=>{
    if(confirm('确定删除这个存钱目标吗？')){
      DB.data.goals = DB.data.goals.filter(g=>g.id!==b.dataset.delgoal);
      DB.save(true); renderGoals(el); toast('已删除');
    }
  });
  el.querySelectorAll('[data-savein]').forEach(b=> b.onclick=()=>{
    const g = DB.data.goals.find(x=>x.id===b.dataset.savein);
    openPrompt(`往「${g.name}」存入金额`, '', (val)=>{
      const v = parseFloat(val);
      if(isNaN(v)||v<=0) return toast('请输入有效金额');
      g.saved += v; DB.save(true); renderGoals(el);
      toast(v>=100?'🎉 存钱高手！':'✅ 存入成功'); flyCoins(4);
    }, 'number');
  });
}

function editGoal(id, el){
  const g = id? DB.data.goals.find(x=>x.id===id) : null;
  const icons = ['🎯','📱','✈️','💻','🎮','🚗','🏠','👟','💍','📷','🎸','🐱'];
  openSheetHTML(`
    <div class="sh-title">${g?'✏️ 编辑目标':'🐷 新建存钱目标'}</div>
    <div class="field"><label>目标名称</label>
      <input class="input" id="gName" placeholder="如：换新手机" value="${g?esc(g.name):''}"></div>
    <div class="field"><label>目标金额</label>
      <input class="input" id="gTarget" type="number" inputmode="decimal" placeholder="如：6000" value="${g?g.target:''}"></div>
    <div class="field"><label>已存金额</label>
      <input class="input" id="gSaved" type="number" inputmode="decimal" placeholder="0" value="${g?g.saved:''}"></div>
    <div class="field"><label>目标日期（可选）</label>
      <input class="input" id="gDeadline" type="date" value="${g?g.deadline||'':''}"></div>
    <div class="field"><label>选个图标</label>
      <div class="chips" id="gIcons">
        ${icons.map(ic=>`<button class="chip ${((g&&g.icon)||'🎯')===ic?'on':''}" data-gic="${ic}">${ic}</button>`).join('')}
      </div>
    </div>
    <div class="sh-actions">
      <button class="btn ghost" onclick="closeSheet()">取消</button>
      <button class="btn" id="gSave">${g?'保存':'创建'}</button>
    </div>
  `);
  let icon = (g&&g.icon)||'🎯';
  document.querySelectorAll('[data-gic]').forEach(b=> b.onclick=()=>{
    icon = b.dataset.gic;
    document.querySelectorAll('[data-gic]').forEach(x=>x.classList.toggle('on', x===b));
  });
  document.getElementById('gSave').onclick = ()=>{
    const name = document.getElementById('gName').value.trim();
    const target = parseFloat(document.getElementById('gTarget').value);
    const saved = parseFloat(document.getElementById('gSaved').value)||0;
    const deadline = document.getElementById('gDeadline').value;
    if(!name) return toast('请填写目标名称');
    if(isNaN(target)||target<=0) return toast('请填写有效目标金额');
    if(g){ Object.assign(g,{name,target,saved,deadline,icon}); }
    else {
      const bkId = DB.data.curBook==='all' ? DB.data.books[0].id : DB.data.curBook;
      DB.data.goals.push({id:uid(),name,target,saved,deadline,icon,book:bkId});
    }
    DB.save(true); closeSheet(); renderGoals(el);
    toast(g?'✅ 已保存':'🎉 目标创建成功'); flyCoins(4);
  };
}
</script>

/* =========================================================
   账单报告（周报 / 月报）

function weekRange(offset){
  offset = offset||0;
  const n = new Date(); n.setDate(n.getDate()-offset*7);
  const day = (n.getDay()+6)%7;
  const s = new Date(n); s.setDate(s.getDate()-day);
  const e = new Date(s); e.setDate(e.getDate()+6);
  return [fmtDate(s), fmtDate(e)];
}

function buildReport(from, to, title){
  const list = txAll().filter(t=>t.date>=from&&t.date<=to);
  const exp = list.filter(t=>t.type==='expense');
  const inc = list.filter(t=>t.type==='income');
  const expSum = exp.reduce((s,t)=>s+t.amount,0);
  const incSum = inc.reduce((s,t)=>s+t.amount,0);
  const byCat = {};
  exp.forEach(t=> byCat[t.category]=(byCat[t.category]||0)+t.amount);
  const cats = Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const avg = exp.length? expSum/exp.length : 0;
  const top = cats[0];

  // 幽默点评
  let quip = '';
  if(exp.length===0) quip = '这段时间一分钱没花？你是神仙吗 🧘';
  else if(expSum>5000) quip = `花了 ${fmtMoney(expSum)} 元，钱包表示想静静 😮‍💨`;
  else if(expSum>2000) quip = `${fmtMoney(expSum)} 元说多不多说少不少，继续保持理性消费哦 💪`;
  else quip = `只花了 ${fmtMoney(expSum)} 元，省钱小能手就是你 🏅`;

  const catQuips = {
    '奶茶':'奶茶刺客又出手了 🧋', '餐饮':'干饭人，干饭魂 🍚', '购物':'剁手一时爽，账单火葬场 🛍️',
    '交通':'奔波劳碌的你 🚇', '娱乐':'会玩才开心 🎮', '居住':'房租永远准时 😮‍💨'
  };

  return {from,to,title,expSum,incSum,list,exp,cats,avg,quip,top,catQuips,bal:incSum-expSum};
}

function calcStreak(){
  const dates = new Set(DB.data.tx.map(t=>t.date));
  if(!dates.size) return 0;
  let streak = 0;
  const d = new Date();
  // 若今天没记，从昨天开始算
  if(!dates.has(fmtDate(d))) d.setDate(d.getDate()-1);
  while(dates.has(fmtDate(d))){ streak++; d.setDate(d.getDate()-1); }
  return streak;
}

function checkAchievements(){
  const got = DB.data.ach.badges || [];
  const newly = [];
  BADGES.forEach(b=>{
    if(!got.includes(b.id) && b.check()){ got.push(b.id); newly.push(b); }
  });
  DB.data.ach.badges = got;
  const s = calcStreak();
  if(s > (DB.data.ach.maxStreak||0)) DB.data.ach.maxStreak = s;
  DB.save(true);
  if(newly.length && state.page!=='chat'){
    setTimeout(()=>{
      toast(`🏆 解锁徽章：${newly[0].icon} ${newly[0].name}`);
      flyCoins(6);
    }, 400);
  }
  return newly;
}

    DB.data.settings.apiUrl = document.getElementById('apiUrl').value.trim()||'https://api.openai.com/v1/chat/completions';
    DB.data.settings.apiModel = document.getElementById('apiModel').value.trim()||'gpt-4o-mini';
    DB.save(true); toast('✅ AI 配置已保存'); checkAchievements();
  };
  document.getElementById('expJson').onclick = ()=>{
    download('小钱袋备份_'+todayStr()+'.json', JSON.stringify(DB.data,null,2), 'application/json');
    toast('📤 已导出备份');
  };
  document.getElementById('expCsv').onclick = ()=>{
    const rows = [['日期','类型','账本','分类','标签','备注','金额']];
    txSorted().forEach(t=>{
      const bk = getBook(t.book);
      rows.push([t.date, t.type==='income'?'收入':'支出', bk?bk.name:'', t.category, (t.tags||[]).join('/'), t.note, t.amount]);
    });
    const csv = '\ufeff' + rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
    download('小钱袋账单_'+todayStr()+'.csv', csv, 'text/csv');
    toast('📊 已导出 CSV');
  };
  document.getElementById('impJson').onclick = ()=> document.getElementById('impFile').click();
  document.getElementById('impFile').onchange = e=>{
    const f = e.target.files[0]; if(!f) return;
    const rd = new FileReader();
    rd.onload = ()=>{
      try{
        const d = JSON.parse(rd.result);
        if(!d.tx) throw new Error('格式不对');
        if(!confirm('导入将覆盖当前全部数据，确定继续？')) return;
        DB.data = DB.normalize(d); DB.attachSave(); DB.save(true); toast('📥 导入成功！');
        renderDrawer(); renderPage(state.page);
      }catch(err){ toast('❌ 文件格式有误'); }
    };
    rd.readAsText(f);
  };
  document.getElementById('clrChat').onclick = ()=>{
    if(confirm('清空聊天记录？账目不受影响。')){ DB.data.chat=[]; DB.save(true); toast('已清空'); }
  };
  document.getElementById('resetAll').onclick = ()=>{
    if(confirm('⚠️ 将删除所有账目并恢复初始状态，确定吗？')){
      DB.reset(); toast('已重置'); go('home'); renderDrawer();
    }
  };
  document.getElementById('addHome').onclick = ()=>{
    alert('📲 添加到主屏幕：\n\n• iPhone Safari：点底部「分享」→「添加到主屏幕」\n• Android Chrome：点右上「⋮」→「添加到主屏幕」\n\n添加后就能像原生 App 一样全屏使用啦！');
  };
}

function download(name, content, type){
  const blob = new Blob([content], {type});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

/* =========================================================
   弹层：记账 / 详情 / 输入框
   ========================================================= */
function openSheet(mode, preset){
  state.sheetMode = mode;
  const f = state.form;
  const curBook = DB.data.curBook==='all' ? DB.data.books[0].id : DB.data.curBook;
  if(mode==='add'){
    f.type = (preset&&preset.type)||'expense';
    f.amount = (preset&&preset.amount!=null) ? String(preset.amount) : '';
    f.category = (preset&&preset.category) || (f.type==='income'?'工资':'餐饮');
    f.note = (preset&&preset.note) || '';
    f.date = todayStr();
    f.book = (preset&&preset.book) || curBook;
    f.tags = (preset&&preset.tags) ? [...preset.tags] : [];
    f.attach = [];
    f.scope = (preset&&preset.scope) || 'shared';
  }
  renderSheet();
}

function renderSheet(){
  const f = state.form;
  if(!f.tags) f.tags = [];
  if(!f.attach) f.attach = [];
  if(!f.book) f.book = DB.data.curBook==='all' ? DB.data.books[0].id : DB.data.curBook;
  if(!f.scope) f.scope = 'shared';
  const cats = catList(f.type, true);
  if(!cats.find(c=>c.name===f.category)) f.category = cats[0] ? cats[0].name : '其他';
  const isEdit = state.sheetMode==='edit';
  const books = DB.data.books;
  const knownTags = tagsOfCurrentBook();
  const linked = isSyncOn();
  const i = me();

  openSheetHTML(`
    <div class="sh-title">${isEdit?'✏️ 编辑账目':'📝 记一笔'}</div>
    <div class="type-tabs">
      <button class="type-tab ${f.type==='expense'?'on exp':''}" data-stype="expense">💸 支出</button>
      <button class="type-tab ${f.type==='income'?'on inc':''}" data-stype="income">💰 收入</button>
    </div>
    ${linked?`
    <div class="field"><label>这笔算谁的</label>
      <div class="chips">
        <button class="chip ${f.scope==='shared'?'on':''}" data-sscope="shared">👫 共同账本</button>
        <button class="chip ${f.scope==='personal'?'on':''}" data-sscope="personal">🔒 我的私账（对方看不到）</button>
      </div>
    </div>`:''}
    <div class="field">
      <input class="amount-input" id="fAmount" type="number" inputmode="decimal" placeholder="0.00" value="${f.amount}">
    </div>
    <div class="field"><label>分类</label>
      <div class="cat-pick">
        ${cats.map(c=>`<button class="cat-p ${f.category===c.name?'on':''}" data-scat="${esc(c.name)}">
          <span class="cp-ico">${c.icon}</span><span>${esc(c.name)}</span></button>`).join('')}
        <button class="cat-p" data-newcat="1" style="border-style:dashed">
          <span class="cp-ico">➕</span><span>新建</span></button>
      </div>
    </div>
    ${books.length>1?`
    <div class="field"><label>账本</label>
      <div class="chips">
        ${books.map(b=>`<button class="chip ${f.book===b.id?'on':''}" data-sbook="${b.id}">${b.icon} ${esc(b.name)}</button>`).join('')}
      </div>
    </div>`:''}
    <div class="field"><label>标签 <span style="font-weight:600;color:var(--ink-3);font-size:11px">选填，可多选</span></label>
      <div class="tag-list" id="tagPick">
        ${knownTags.map(g=>`<button class="tag-chip pick ${f.tags.includes(g)?'on':''}" data-stag="${esc(g)}">${f.tags.includes(g)?'✓ ':''}${esc(g)}</button>`).join('')}
        <button class="tag-chip pick" id="tagAdd">＋ 新标签</button>
      </div>
    </div>
    <div class="field"><label>备注</label>
      <input class="input" id="fNote" placeholder="花在哪儿了？" value="${esc(f.note)}"></div>
    <div class="field"><label>日期</label>
      <input class="input" id="fDate" type="date" value="${f.date}"></div>
    <div class="field"><label>票据 / 照片 <span style="font-weight:600;color:var(--ink-3);font-size:11px">选填</span></label>
      <div class="attach-strip" id="attStrip">
        ${f.attach.map((a,idx)=>`
          <div class="attach-wrap">
            <img class="attach-thumb" src="${a.src}" data-viewimg="${idx}">
            <button class="attach-del" data-attdel="${idx}">✕</button>
          </div>`).join('')}
        <button class="attach-add" id="attAdd"><span>📷</span><span>添加</span></button>
      </div>
      <input type="file" id="attFile" accept="image/*" capture="environment" style="display:none">
    </div>
    <div class="sh-actions">
      ${isEdit?`<button class="btn coral" id="fDel">删除</button>`:''}
      <button class="btn ghost" onclick="closeSheet()">取消</button>
      <button class="btn" id="fSave">保存</button>
    </div>
  `);

  const amtIn = document.getElementById('fAmount');
  setTimeout(()=> amtIn.focus(), 120);
  amtIn.oninput = ()=> f.amount = amtIn.value;
  document.querySelectorAll('[data-stype]').forEach(b=> b.onclick=()=>{ f.type=b.dataset.stype; f.category=''; renderSheet(); });
  document.querySelectorAll('[data-sscope]').forEach(b=> b.onclick=()=>{ f.scope=b.dataset.sscope; renderSheet(); });
  document.querySelectorAll('[data-scat]').forEach(b=> b.onclick=()=>{ f.category=b.dataset.scat; renderSheet(); });
  const nc = document.querySelector('[data-newcat]');
  if(nc) nc.onclick = ()=>{ closeSheet(); setTimeout(()=> openCatEdit(null, f.type), 220); };
  document.querySelectorAll('[data-sbook]').forEach(b=> b.onclick=()=>{ f.book=b.dataset.sbook; renderSheet(); });
  document.querySelectorAll('[data-stag]').forEach(b=> b.onclick=()=>{
    const g = b.dataset.stag;
    const i = f.tags.indexOf(g);
    if(i>=0) f.tags.splice(i,1); else f.tags.push(g);
    renderSheet();
  });
  document.getElementById('tagAdd').onclick = ()=>{
    openPrompt('🏷️ 新标签','', v=>{
      const g = v.trim();
      if(!g) return;
      if(!f.tags.includes(g)) f.tags.push(g);
      renderSheet();
    });
  };
  document.getElementById('fNote').oninput = e=> f.note = e.target.value;
  document.getElementById('fDate').onchange = e=> f.date = e.target.value;

  // 附件
  const attAdd = document.getElementById('attAdd'), attFile = document.getElementById('attFile');
  attAdd.onclick = ()=> attFile.click();
  attFile.onchange = async e=>{
    const file = e.target.files[0]; if(!file) return;
    toast('🖼️ 正在压缩图片…');
    try{
      const a = await compressImage(file, 800, 0.6);
      if(f.attach.length>=6) return toast('最多 6 张附件哦');
      f.attach.push(a);
      renderSheet();
      toast('✅ 已添加附件');
    }catch(err){ toast('❌ '+(err.message||'图片处理失败')); }
    attFile.value='';
  };
  document.querySelectorAll('[data-attdel]').forEach(b=> b.onclick=()=>{
    f.attach.splice(Number(b.dataset.attdel),1); renderSheet();
  });
  document.querySelectorAll('[data-viewimg]').forEach(b=> b.onclick=()=>{
    viewImage(f.attach[Number(b.dataset.viewimg)].src);
  });

  document.getElementById('fSave').onclick = ()=>{
    const amt = parseFloat(document.getElementById('fAmount').value);
    if(isNaN(amt)||amt<=0) return toast('请输入有效金额');
    const note = document.getElementById('fNote').value.trim() || f.category;
    const date = document.getElementById('fDate').value || todayStr();
    if(isEdit){
      const t = DB.data.tx.find(x=>x.id===state.editingId);
      if(t){
        Object.assign(t, {type:f.type, amount:Math.round(amt*100)/100, category:f.category, note, date,
          book:f.book, tags:[...f.tags], attach:[...f.attach], scope:f.scope});
        touch(t, 'tx');
      }
      DB.save(true); closeSheet(); toast('✅ 已更新'); flyCoins(2);
      if(isSyncOn()) setTimeout(()=>doSync(true), 300);
    }else{
      const created = addItems([{type:f.type, amount:amt, category:f.category, note, tags:f.tags, attach:f.attach, scope:f.scope}], {date, book:f.book});
      closeSheet(); toast(f.scope==='personal'?'✅ 已记入私账（不同步）':'✅ 记账成功'); flyCoins(3);
      // 幽默反馈
      if(DB.data.settings.humor!==false){
        const it = created[0];
        const msg = humorFor({...it});
        setTimeout(()=>{
          if(state.page==='chat'){ pushChat({role:'bot', text:msg, items:[it], ts:Date.now()}); }
          else { toast(msg.replace(/\n/g,' ').slice(0,42)+'…'); }
        }, 300);
      }
    }
    refreshIfNeeded();
    if(state.page==='report') renderPage('report');
  };
  if(isEdit) document.getElementById('fDel').onclick = ()=>{
    if(confirm('删除这笔账目？'+(isSyncOn()?'（对方也会同步删除）':''))){
      const t = DB.data.tx.find(x=>x.id===state.editingId);
      if(isSyncOn() && t){ tombstone(t,'tx'); DB.data.tx = DB.data.tx.filter(x=>x.id!==state.editingId); setTimeout(()=>doSync(true),200); }
      else DB.data.tx = DB.data.tx.filter(x=>x.id!==state.editingId);
      DB.save(true); closeSheet(); toast('已删除'); refreshIfNeeded();
    }
  };
}

      <button class="btn ghost" onclick="closeSheet()">关闭</button>
      <button class="btn" id="dEdit">✏️ 编辑</button>

      book:t.book, tags:[...(t.tags||[])], attach:[...(t.attach||[])], scope:t.scope||'shared'};

  };
}

function openPrompt(title, defVal, cb, type){
  openSheetHTML(`
    <div class="sh-title">${title}</div>
    <div class="field"><input class="input" id="pVal" type="${type==='number'?'number':'text'}" inputmode="${type==='number'?'decimal':'text'}" value="${defVal!==null&&defVal!==undefined?defVal:''}" placeholder="请输入…" style="font-size:19px;font-weight:800;text-align:center"></div>
    <div class="sh-actions">
      <button class="btn ghost" onclick="closeSheet()">取消</button>
      <button class="btn" id="pOk">确定</button>
    </div>
  `);
  const inp = document.getElementById('pVal');
  setTimeout(()=>inp.focus(),120);
  document.getElementById('pOk').onclick = ()=>{ closeSheet(); cb(inp.value); };
  inp.onkeydown = e=>{ if(e.key==='Enter'){ closeSheet(); cb(inp.value); } };
}

function openSheetHTML(html){
  const s = document.getElementById('sheet');
  s.innerHTML = `<div class="sh-scrim" onclick="closeSheet()"></div><div class="sh-panel"><div class="sh-grip"></div>${html}</div>`;
  s.classList.add('show');
}
function closeSheet(){ document.getElementById('sheet').classList.remove('show'); }

function openTplEdit(id){
  const t = id ? DB.data.templates.find(x=>x.id===id) : null;
  let type = t?t.type:'expense';
  let category = t?t.category:'餐饮';
  const books = DB.data.books;
  const curBook = DB.data.curBook==='all' ? DB.data.books[0].id : DB.data.curBook;

  const draw = ()=>{
    const cats = catList(type, true);
    if(!cats.find(c=>c.name===category)) category = cats[0]?cats[0].name:'其他';
    openSheetHTML(`
      <div class="sh-title">${t?'✏️ 编辑模板':'⚡ 新建速记模板'}</div>
      <div class="type-tabs">
        <button class="type-tab ${type==='expense'?'on exp':''}" data-tt="expense">💸 支出</button>
        <button class="type-tab ${type==='income'?'on inc':''}" data-tt="income">💰 收入</button>
      </div>
      <div class="field"><label>模板名称</label>
        <input class="input" id="tpName" placeholder="如：早餐饮料" value="${t?esc(t.name):''}"></div>
      <div class="field"><label>固定金额</label>
        <input class="input" id="tpAmt" type="number" inputmode="decimal" placeholder="0.00" value="${t?t.amount:''}" style="font-size:22px;font-weight:800;text-align:center"></div>
      <div class="field"><label>分类</label>
        <div class="cat-pick" style="grid-template-columns:repeat(5,1fr)">
          ${cats.map(c=>`<button class="cat-p ${category===c.name?'on':''}" data-tpcat="${esc(c.name)}">
            <span class="cp-ico" style="font-size:18px">${c.icon}</span><span>${esc(c.name)}</span></button>`).join('')}
        </div>
      </div>
      ${books.length>1?`
      <div class="field"><label>账本</label>
        <div class="chips">
          ${books.map(b=>`<button class="chip ${(t?t.book:curBook)===b.id?'on':''}" data-tpbook="${b.id}">${b.icon} ${esc(b.name)}</button>`).join('')}
        </div>
      </div>`:''}
      <div class="field"><label>备注（选填）</label>
        <input class="input" id="tpNote" placeholder="留空则用模板名称" value="${t?esc(t.note||''):''}"></div>
      <div class="sh-actions">
        <button class="btn ghost" onclick="closeSheet()">取消</button>
        <button class="btn" id="tpSave">${t?'保存':'创建'}</button>
      </div>
    `);
    let book = t?t.book:curBook;
    document.querySelectorAll('[data-tt]').forEach(b=> b.onclick=()=>{ type=b.dataset.tt; draw(); });
    document.querySelectorAll('[data-tpcat]').forEach(b=> b.onclick=()=>{ category=b.dataset.tpcat; draw(); });
    document.querySelectorAll('[data-tpbook]').forEach(b=> b.onclick=()=>{ book=b.dataset.tpbook; draw(); });
    document.getElementById('tpSave').onclick = ()=>{
      const name = document.getElementById('tpName').value.trim();
      const amt = parseFloat(document.getElementById('tpAmt').value);
      if(!name) return toast('请填写模板名称');
      if(isNaN(amt)||amt<=0) return toast('请输入有效金额');
      const note = document.getElementById('tpNote').value.trim();

/* ---------------- 🎊 存钱挑战 ---------------- */
function renderChallenge(el){
  const curBook = DB.data.curBook==='all' ? DB.data.books[0].id : DB.data.curBook;
  const list = DB.data.challenges.filter(c=>c.book===curBook || DB.data.curBook==='all');

      用「游戏化」的方式逼自己存钱。最经典的是 <b>52 周存钱法</b>：第 1 周存 10 元、第 2 周 20 元……第 52 周 520 元，一年攒下 13780 元！
    </div>

    <div class="sec-title">我的挑战 <span class="more" style="margin-left:auto;font-size:11px;color:var(--ink-3)">${list.length} 个</span></div>

  `;
  document.getElementById('chalAdd').onclick = ()=> openChalEdit();
  const rst = document.getElementById('chalReset');
  if(rst) rst.onclick = ()=>{
    if(!confirm('重置所有挑战进度？已打勾的记录会清空。')) return;
    list.forEach(c=> c.done = {});
    DB.save(true); renderChallenge(el); toast('已重置挑战进度');
  };
  el.querySelectorAll('[data-chal]').forEach(b=> b.onclick=()=> toggleChalPeriod(b.dataset.chal, Number(b.dataset.cell)));
  el.querySelectorAll('[data-chaldel]').forEach(b=> b.onclick=()=>{
    const c = DB.data.challenges.find(x=>x.id===b.dataset.chaldel);
    if(!c || !confirm(`删除挑战「${c.name}」？`)) return;
    DB.data.challenges = DB.data.challenges.filter(x=>x.id!==c.id);
    DB.save(true); renderChallenge(el); toast('已删除挑战');
  });
  el.querySelectorAll('[data-chalfill]').forEach(b=> b.onclick=()=>{
    const c = DB.data.challenges.find(x=>x.id===b.dataset.chalfill);
    if(!c) return;
    openPrompt('💰 本期存入金额', c.per||10, v=>{
      const amt = parseFloat(v);
      if(isNaN(amt)||amt<=0) return toast('请输入有效金额');
      c.per = Math.round(amt*100)/100;
      DB.save(true); renderChallenge(el); toast('✅ 已更新每期金额'); flyCoins(2);
    }, 'number');
  });
}

function challengeCard(c){
  const total = c.periods;
  const doneN = Object.keys(c.done||{}).length;
  const saved = Object.values(c.done||{}).reduce((s,v)=>s+v,0);
  const allTarget = Array.from({length:total},(_,i)=> c.per*(i+1)).reduce((a,b)=>a+b,0);
  const pct = allTarget?Math.min(saved/allTarget*100,100):0;
  const curP = currentChalPeriod(c);
  const cells = Array.from({length:total},(_,i)=>{
    const amt = c.per*(i+1);
    const isDone = (c.done||{})[i]!=null;
    const cls = isDone?'done':(i===curP?'today':'');
    return `<button class="chal-cell ${cls}" data-chal="${c.id}" data-cell="${i}" title="第${i+1}期 ¥${fmtMoney(amt)}">
      <b>${i+1}</b><span>${isDone?'✓':'¥'+fmtMoney(amt)}</span></button>`;
  }).join('');

  return `<div class="goal-card">
    <div class="chal-hero" style="padding:15px;margin-bottom:12px">
      <div class="ch-t">${c.icon} ${esc(c.name)}</div>
      <div class="ch-big">¥${fmtMoney(saved)}<small> / ${fmtMoney(allTarget)}</small></div>
      <div class="ch-s">已完成 ${doneN}/${total} 期 · 每期 ¥${fmtMoney(c.per)} 起递增</div>
    </div>
    <div class="goal-amt" style="margin-top:0">
      <span>进度</span><span><b>${pct.toFixed(1)}%</b> · 还差 ¥${fmtMoney(Math.max(allTarget-saved,0))}</span>
    </div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="sec-title" style="margin:14px 0 8px;font-size:12px">点一下打卡，再点一次撤销 👇</div>
    <div class="chal-grid">${cells}</div>
    <div class="goal-actions">
      <button class="btn sm mint" data-chalfill="${c.id}">💰 改每期金额</button>
      <button class="btn sm coral" data-chaldel="${c.id}">🗑 删除挑战</button>
    </div>
  </div>`;
}

/* 当前应该打卡的期数（第一个未完成的） */
function currentChalPeriod(c){
  for(let i=0;i<c.periods;i++){ if((c.done||{})[i]==null) return i; }
  return -1;
}

function toggleChalPeriod(id, i){
  const c = DB.data.challenges.find(x=>x.id===id); if(!c) return;
  c.done = c.done || {};
  const amt = c.per*(i+1);
  if(c.done[i]!=null){
    delete c.done[i];
    toast(`↩️ 已撤销第 ${i+1} 期`);
  }else{
    c.done[i] = amt;
    toast(`🎉 第 ${i+1} 期打卡成功！存入 ¥${fmtMoney(amt)}`);
    flyCoins(4);
  }
  DB.save(true);
  const el = document.getElementById('page-challenge');
  if(el) renderChallenge(el);
}

function saveCat(oldName, type, opt){
  const name = document.getElementById('catName').value.trim();
  if(!name) return toast('请填写分类名称');
  if(name.length>8) return toast('名称最多 8 个字');
  const words = (opt.words||'').split(/[\s,，、]+/).filter(Boolean);
  const list = catList(type);

  if(oldName){
    // 改名
    if(name!==oldName){
      if(list.some(c=>c.name===name)) return toast('❌ 已存在同名分类');
      const r = renameCat(oldName, name, type);
      if(!r.ok) return toast('❌ '+r.msg);
    }
    const c = findCat(name, type);
    c.icon = opt.icon; c.color = opt.color; c.words = words;
  }else{
    if(list.some(c=>c.name===name)) return toast('❌ 已存在同名分类');
    list.push({id:'c'+uid(), name, icon:opt.icon, color:opt.color, hidden:false, words});
  }
  DB.save(true); closeSheet();
  const el = document.getElementById('page-cats');
  if(el) renderCats(el);
  toast(oldName?'✅ 已保存':'🎉 分类创建成功'); flyCoins(2);
}

<script>
/* =========================================================
   ☁️ 云同步 · 情侣版
   ---------------------------------------------------------
   一个「家庭」= 一份共享账本；两人各自一份本地数据，
   通过同步服务合并。共同账本的记录双方可见，
   个人小账本（scope=personal）只有自己看得到。
   ========================================================= */

/* 同步配置
   - 若页面本身就是由同步后端托管（同源），base = 当前 origin
   - 否则读取 <meta name="xmq-server" content="..."> 或 window.XMQ_SERVER
   - 都没有 → 纯本机模式（SYNC.base = ''） */
const SYNC = {
  base: (function(){
    if(window.XMQ_SERVER) return String(window.XMQ_SERVER).replace(/\/$/,'');
    const meta = document.querySelector('meta[name="xmq-server"]');
    if(meta && meta.content) {
      let v = meta.content.replace(/\/$/,'');
      if(v === 'auto') return location.origin;
      return v;
    }
    // 部署在同步后端上的页面：同源且带 /api 可用
    if(location.protocol.startsWith('http') && window.XMQ_BACKED) return location.origin;
    return '';
  })(),
  pollMs: 8000,          // 在线轮询间隔
  enabled: false,
  online: false,
  syncing: false,
  cursor: 0,
  lastSync: 0,
  lastError: '',
  _timer: null,
  _pend: false
};

/* ---------------- 身份 ---------------- */
function me(){
  const s = DB.data.settings;
  s.identity = s.identity || {};
  return s.identity;
}
function memberById(id){
  const m = (DB.data.members||[]).find(x=>x.id===id);
  if(m) return m;
  if(id === me().memberId) return {id, nickname: me().nickname||'我', emoji: me().emoji||'🙋', color: me().color||'#FFB627'};
  return {id, nickname:'TA', emoji:'🐱', color:'#4ECDC4'};
}
function isSyncOn(){ const i = me(); return !!(SYNC.base && i.householdId && i.memberId); }

/* ---------------- HTTP ---------------- */
async function api(path, body, method){
  const url = SYNC.base.replace(/\/$/,'') + path;
  const opt = { headers:{'Content-Type':'application/json'} };
  if(body){ opt.method = method||'POST'; opt.body = JSON.stringify(body); }
  else opt.method = method||'GET';
  const t0 = Date.now();
  const res = await fetch(url, opt);
  const txt = await res.text();
  let data; try{ data = JSON.parse(txt); }catch(e){ throw new Error('服务器返回异常'); }
  if(!res.ok){ throw new Error(data.detail || ('请求失败 '+res.status)); }
  return data;
}

/* ---------------- 家庭：创建 / 加入 / 退出 ---------------- */
async function createHousehold(nickname, emoji, color, hhName){
  const r = await api('/api/household/create', {nickname, emoji, color, householdName: hhName||'我们的家'});
  const i = me();

/* ---------------- 同步引擎 ---------------- */
function startSync(){
  if(!isSyncOn()) return;
  SYNC.enabled = true;
  backfillSyncIds();
  if(SYNC._timer) clearInterval(SYNC._timer);
  SYNC._timer = setInterval(()=> doSync(), SYNC.pollMs);
  doSync(true);
  window.addEventListener('online', ()=>{ SYNC.online = true; doSync(true); });
  window.addEventListener('offline', ()=>{ SYNC.online = false; renderSyncDot(); });
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) doSync(true); });
}
function stopSync(){
  SYNC.enabled = false;
  if(SYNC._timer){ clearInterval(SYNC._timer); SYNC._timer = null; }
  renderSyncDot();
}

/* 收集待同步变更：所有带 syncId 的记录 + 待发送的删除墓碑 */
function collectRecords(){
  const out = [];
  const push = (syncId, kind, payload, updatedAt, deleted)=>{
    out.push({uid:syncId, kind, payload, updatedAt: Math.floor(updatedAt||Date.now()), deleted:!!deleted});
  };
  DB.data.tx.forEach(t=>{
    if(!t.syncId) return;
    push(t.syncId, 'tx', {
      id:t.id, type:t.type, amount:t.amount, category:t.category, note:t.note,
      date:t.date, createdAt:t.createdAt, book:t.book, tags:t.tags||[],
      attach:(t.attach||[]).map(a=>({id:a.id,w:a.w,h:a.h,src:a.src})),
      owner:t.owner||'', scope:t.scope||'shared'
    }, t.updatedAt||t.createdAt||Date.now(), false);
  });
  DB.data.goals.forEach(g=>{ if(g.syncId) push(g.syncId, 'goal', g, g.updatedAt||Date.now(), false); });
  DB.data.recurring.forEach(r=>{ if(r.syncId) push(r.syncId, 'recurring', r, r.updatedAt||Date.now(), false); });
  DB.data.challenges.forEach(c=>{ if(c.syncId) push(c.syncId, 'challenge', c, c.updatedAt||Date.now(), false); });
  DB.data.templates.forEach(t=>{ if(t.syncId) push(t.syncId, 'template', t, t.updatedAt||Date.now(), false); });
  // 待发送的删除墓碑（持久化在 DB.data.tombstones）
  (DB.data.tombstones||[]).forEach(x=> push(x.syncId, x.kind, {}, x.updatedAt||Date.now(), true));
  return out;
}

/* 应用服务端返回的记录到本地（LWW） */
function applyRecords(records){
  let changed = 0;
  const myId = me().memberId;
  records.forEach(rec=>{
    const {uid, kind, payload, updatedAt, deleted} = rec;
    if(!uid || !kind) return;

    // 个人小账本：只保留自己创建的
    if(kind==='tx' && (payload && payload.scope==='personal') && payload.owner!==myId) return;

    const local = findLocalBySyncId(uid, kind);
    if(deleted){
      // 远端已删除
      if(local){
        const lt = local.updatedAt || local.createdAt || 0;
        if(updatedAt >= lt){ removeLocal(kind, local); changed++; }
      }
      return;
    }
    if(local){
      const lt = local.updatedAt || local.createdAt || 0;
      if(updatedAt > lt){
        Object.assign(local, normalizeRemote(kind, payload), {updatedAt});
        changed++;
      }
    }else{
      insertRemote(kind, payload, uid, updatedAt);
      changed++;
    }
  });
  if(changed) DB.save(true);
  return changed;
}

function removeLocal(kind, obj){
  const rm = (arr)=> arr.filter(x=>x.syncId!==obj.syncId);
  if(kind==='tx') DB.data.tx = rm(DB.data.tx);
  else if(kind==='goal') DB.data.goals = rm(DB.data.goals);
  else if(kind==='recurring') DB.data.recurring = rm(DB.data.recurring);
  else if(kind==='challenge') DB.data.challenges = rm(DB.data.challenges);
  else if(kind==='template') DB.data.templates = rm(DB.data.templates);
}

function findLocalBySyncId(syncId, kind){
  if(kind==='tx') return DB.data.tx.find(t=>t.syncId===syncId);
  if(kind==='goal') return DB.data.goals.find(g=>g.syncId===syncId);
  if(kind==='recurring') return DB.data.recurring.find(r=>r.syncId===syncId);
  if(kind==='challenge') return DB.data.challenges.find(c=>c.syncId===syncId);
  if(kind==='template') return DB.data.templates.find(t=>t.syncId===syncId);
  return null;
}
function insertRemote(kind, payload, syncId, updatedAt){
  const obj = normalizeRemote(kind, payload);
  obj.id = obj.id || ('r'+uid());
  obj.syncId = syncId;
  obj.updatedAt = updatedAt;
  if(kind==='tx') DB.data.tx.push(obj);
  else if(kind==='goal') DB.data.goals.push(obj);
  else if(kind==='recurring') DB.data.recurring.push(obj);
  else if(kind==='challenge') DB.data.challenges.push(obj);
  else if(kind==='template') DB.data.templates.push(obj);
}
function normalizeRemote(kind, p){
  const o = JSON.parse(JSON.stringify(p||{}));
  if(kind==='tx'){
    o.tags = o.tags||[]; o.attach = o.attach||[];
    o.scope = o.scope||'shared'; o.updatedAt = o.updatedAt||Date.now();
  }
  return o;
}

/* 一次同步往返 */
async function doSync(force){
  if(!isSyncOn()){ renderSyncDot(); return; }
  if(SYNC.syncing){ SYNC._pend = true; return; }
  SYNC.syncing = true; renderSyncDot();
  try{
    const changes = collectRecords().filter(c=> !c.deleted || true); // 墓碑也要推
    const r = await api('/api/sync', {
      hh: me().householdId, me: me().memberId, since: SYNC.cursor, changes
    });
    if(r.members) DB.data.members = r.members;
    applyRecords(r.records||[]);
    SYNC.cursor = r.cursor || SYNC.cursor;
    SYNC.online = true; SYNC.lastError = ''; SYNC.lastSync = Date.now();
    // 已成功推送的墓碑出队（服务端已记录删除）
    DB.data.tombstones = [];
    DB.save(true);
    refreshIfNeeded();
  }catch(e){
    SYNC.online = false; SYNC.lastError = e.message || String(e);
  }finally{
    SYNC.syncing = false;
    renderSyncDot();
    if(SYNC._pend){ SYNC._pend = false; setTimeout(()=> doSync(true), 400); }
  }
}

/* 标记一条记录为已修改（供各处调用） */
function touch(rec, kind){
  if(!rec) return;
  rec.updatedAt = Date.now();
  if(isSyncOn()){
    rec.syncId = rec.syncId || ((kind==='tx'?'tx':kind)+uid());
    setTimeout(()=> doSync(true), 350);
  }
}
/* 标记一条记录为删除：从本地移除，并放入待同步墓碑队列 */
function tombstone(rec, kind){
  if(!rec) return;
  if(isSyncOn() && rec.syncId){
    DB.data.tombstones = DB.data.tombstones || [];
    DB.data.tombstones.push({syncId:rec.syncId, kind:kind||'tx', updatedAt:Date.now()});
    setTimeout(()=> doSync(true), 200);
  }
}

/* 首次连接家庭后，给本机所有历史记录补 syncId / updatedAt */
function backfillSyncIds(){
  const stamp = (arr, kind)=> (arr||[]).forEach(x=>{
    if(!x.syncId) x.syncId = (kind==='tx'?'tx':kind)+uid();
    if(!x.updatedAt) x.updatedAt = x.createdAt || Date.now();
    if(!x.owner) x.owner = me().memberId || '';
    if(kind==='tx' && !x.scope) x.scope = 'shared';
  });
  stamp(DB.data.tx,'tx'); stamp(DB.data.goals,'goal');
  stamp(DB.data.recurring,'recurring'); stamp(DB.data.challenges,'challenge');
  stamp(DB.data.templates,'template');
  DB.save(true);
}

  return {t:'已同步', c:'#37C978', i:'☁️'};
}

  if(!el) return;

}

  if(!SYNC.base){
    el.innerHTML = `<div class="notice" style="border-color:#FFD9D9;background:linear-gradient(135deg,#FFF1F1,#FFE5E5)">
      <b style="color:var(--coral)">⚠️ 纯本机模式</b><br>当前页面未连接同步服务，只能单人使用。</div>`;
    renderOnboard(el); return;
  }
  if(!isSyncOn()){
    el.innerHTML = `<div class="notice">
      <b>👫 还没有连接家庭</b><br>连接后两个人的账目会自动同步到对方。
    </div>
    <button class="btn block" id="famConnect">🔗 连接家庭</button>
    <div style="height:12px"></div>`;
    document.getElementById('famConnect').onclick = ()=> renderOnboard(el);
    return;
  }

  const i = me();
  const s = syncStatusText();
  const members = DB.data.members||[];
  const [f,t] = monthRange();
  const monthTx = txAll().filter(x=>x.date>=f && x.date<=t);

  const statOf = mid => {
    const list = monthTx.filter(x=>x.owner===mid);
    return {
      exp: list.filter(x=>x.type==='expense').reduce((a,b)=>a+b.amount,0),
      inc: list.filter(x=>x.type==='income').reduce((a,b)=>a+b.amount,0),
      n: list.length
    };
  };
  const totalExp = monthTx.filter(x=>x.type==='expense').reduce((a,b)=>a+b.amount,0);
  const totalInc = monthTx.filter(x=>x.type==='income').reduce((a,b)=>a+b.amount,0);
  const recent = txSorted().filter(x=>x.scope!=='personal' || x.owner===i.memberId).slice(0,6);

  el.innerHTML = `
    <div class="hero" style="background:linear-gradient(135deg,#FF9EC4 0%,#C88AF5 52%,#7B9EFF 100%)">
      <div class="h-label">👫 ${esc(DB.data.householdName||'我们的家')} · ${new Date().getMonth()+1}月合计</div>
      <div class="h-amount"><small>¥</small>${fmtMoney(totalExp)}</div>
      <div class="h-sub">本月共同支出 · 收入 ¥${fmtMoney(totalInc)}</div>
      <div class="h-row">
        <div class="h-pill"><b>${members.length}</b><span>位成员</span></div>
        <div class="h-pill"><b style="color:${s.c}">${s.i}</b><span>${s.t}</span></div>
      </div>
    </div>

    <div class="card">
      <div class="card-t"><h3>🎟️ 邀请码</h3>
        <button class="btn sm ghost" id="famCopy" style="padding:4px 11px;font-size:12px">复制</button></div>
      <div style="text-align:center;font-size:30px;font-weight:900;letter-spacing:7px;color:var(--gold-deep);
        background:linear-gradient(135deg,#FFF7E6,#FFEFD0);border-radius:14px;padding:12px;border:2px dashed rgba(255,182,39,.55)">
        ${esc(i.inviteCode||'')}
      </div>
      <p style="font-size:11.5px;color:var(--ink-3);font-weight:600;text-align:center;margin-top:9px">
        让 TA 打开同一个网页，点「输入邀请码加入」即可
      </p>
    </div>

    <div class="sec-title">本月贡献榜</div>
    ${members.map(m=>{
      const st = statOf(m.id);
      const pct = totalExp ? (st.exp/totalExp*100) : 0;
      return `<div class="goal-card" style="padding:13px">
        <div style="display:flex;align-items:center;gap:11px">
          <div class="tx-icon" style="background:${m.color}22;width:44px;height:44px;font-size:22px">${m.emoji||'🙂'}</div>
          <div style="flex:1;min-width:0">
            <b style="font-size:14.5px;font-weight:800">${esc(m.nickname)}${m.id===i.memberId?' <span style="font-size:10px;color:var(--gold-deep)">(我)</span>':''}</b>
            <span style="font-size:11.5px;color:var(--ink-3);font-weight:600;display:block">${st.n} 笔 · 支出 ¥${fmtMoney(st.exp)} · 收入 ¥${fmtMoney(st.inc)}</span>
          </div>
          <div style="text-align:right">
            <b style="font-size:16px;font-weight:900;color:#E8413C">${pct.toFixed(0)}%</b>
            <span style="font-size:10px;color:var(--ink-3);font-weight:700;display:block">占比</span>
          </div>
        </div>
        <div class="bar" style="margin-top:10px"><i style="width:${pct}%;background:linear-gradient(90deg,${m.color},${m.color}cc)"></i></div>
      </div>`;
    }).join('')}

    <div class="sec-title">最近共同账目 <span style="margin-left:auto;font-size:11px;color:var(--ink-3)" data-go="list">全部 ›</span></div>
    <div class="card" style="padding:4px 14px">
      ${recent.length? recent.map(txRow).join('') : `<div class="empty"><span class="em-ico">🪙</span><b>还没有共同账目</b><span>记一笔就会同步给 TA 啦</span></div>`}
    </div>

    <div class="sec-title">家庭设置</div>
    <div class="card" style="padding:4px 14px">
      <div class="set-row"><div class="sr-ico">🔄</div>
        <div class="sr-mid"><b>立即同步</b><span>${SYNC.lastSync?'上次 '+fmtTime(SYNC.lastSync):'尚未同步'}${SYNC.lastError?' · '+SYNC.lastError:''}</span></div>
        <button class="btn sm" id="famSync">同步</button></div>
      <div class="set-row"><div class="sr-ico">🔒</div>
        <div class="sr-mid"><b>个人小账本</b><span>标记为「我的」的账目对方看不到</span></div>
        <span style="font-size:12px;font-weight:800;color:var(--mint-deep)">${DB.data.tx.filter(x=>x.scope==='personal'&&x.owner===i.memberId).length} 笔</span></div>
      <div class="set-row"><div class="sr-ico">🚪</div>
        <div class="sr-mid"><b style="color:var(--coral)">退出家庭</b><span>本机数据保留，停止同步</span></div>
        <button class="btn sm coral" id="famLeave">退出</button></div>
    </div>
  `;
  const cp = document.getElementById('famCopy'); if(cp) cp.onclick = ()=> fallbackCopy(i.inviteCode||'');
  const sy = document.getElementById('famSync'); if(sy) sy.onclick = async ()=>{ toast('🔄 同步中…'); await doSync(true); toast(SYNC.online?'✅ 已同步成功':'⚠️ 当前离线，稍后自动补'); renderFamily(el); };
  const lv = document.getElementById('famLeave'); if(lv) lv.onclick = ()=>{ if(confirm('退出家庭？本机数据保留，但不再与对方同步。')) leaveHousehold(); };
  el.querySelectorAll('[data-go]').forEach(b=> b.onclick=()=> go(b.dataset.go));
  el.querySelectorAll('[data-txid]').forEach(b=> b.onclick=()=> showTxDetail(b.dataset.txid));
}
</script>
<script>
/* =========================================================
   启动
   ========================================================= */
function initApp(){
  DB.load();

  // 休息日自动入账周期项
  autoRunRecurring();

  const content = document.getElementById('content');
  // 预建页面容器
  PAGES.forEach(p=>{
    const div = document.createElement('div');
    div.className = 'page'; div.id = 'page-'+p.id;
    content.appendChild(div);
  });
  // 引导页（不在侧边栏，仅在未连接家庭时显示）
  if(!document.getElementById('page-onboard')){
    const ob = document.createElement('div');
    ob.className = 'page'; ob.id = 'page-onboard';
    content.appendChild(ob);
  }

  renderDrawer();

  document.getElementById('menuBtn').onclick = openDrawer;
  document.getElementById('scrim').onclick = closeDrawer;
  document.getElementById('quickAddBtn').onclick = ()=> openSheet('add');

  // 滑动打开抽屉
  let sx=0, sy=0, tracking=false;
  content.addEventListener('touchstart', e=>{
    const t=e.touches[0]; sx=t.clientX; sy=t.clientY;
    tracking = sx < 34;
  }, {passive:true});
  content.addEventListener('touchmove', e=>{
    if(!tracking) return;
    const t=e.touches[0];
    if(t.clientX - sx > 55 && Math.abs(t.clientY-sy)<50){ tracking=false; openDrawer(); }
  }, {passive:true});

  // 键盘快捷键（桌面调试）
  document.addEventListener('keydown', e=>{
    if(e.key==='Escape'){ closeSheet(); closeDrawer(); }
  });

  // 每日首次打开问候
  const lastOpen = localStorage.getItem('xiaomiqian_dai_lastopen');
  if(lastOpen !== todayStr()){
    localStorage.setItem('xiaomiqian_dai_lastopen', todayStr());
    autoWeeklyReportHint();
  }

  // 启动记账提醒
  setupReminder();
  checkAlerts();

  // 启动云同步（若已连接家庭）
  if(isSyncOn()){
    startSync();
    checkAchievements();
    go('home');
  }else if(SYNC.base){
    // 已部署到同步服务但还没连接家庭 → 引导页
    go('onboard');
    checkAchievements();
  }else{
    go('home');
    checkAchievements();
  }
  renderSyncDot();
}

/* =========================================================
   🔔 提醒系统
   ========================================================= */
async function requestNotifyPermission(){
  if(!('Notification' in window)) return false;
  if(Notification.permission === 'granted') return true;
  if(Notification.permission === 'denied') return false;
  try{
    const p = await Notification.requestPermission();
    return p === 'granted';
  }catch(e){ return false; }
}

function pushNotify(title, body){
  try{
    if('Notification' in window && Notification.permission==='granted'){
      new Notification(title, {body, icon:'', tag:'xiaomiqian_dai'});
      return true;
    }
  }catch(e){}
  return false;
}

/* 每天定时提醒（页面在后台时用 setTimeout + 时间差计算） */
function setupReminder(){
  const r = DB.data.settings.remind;
  if(window._remindTimer){ clearTimeout(window._remindTimer); window._remindTimer=null; }
  if(!r || !r.on) return;

  const tick = ()=>{
    const now = new Date();
    const [h,m] = (r.time||'21:00').split(':').map(Number);
    const target = new Date(now.getFullYear(), now.getMonth(), now.getDate(), h||21, m||0, 0, 0);
    let delay = target - now;
    if(delay < 0) delay += 86400000;   // 明天同一时间

    // 今天的提醒是否已经触发过
    const doneKey = 'xiaomiqian_dai_remind_'+todayStr();
    if(delay > 60000 && localStorage.getItem(doneKey)) delay = delay;
    // 若当前已过点且今日未提醒（刚打开页面）
    if(target <= now && !localStorage.getItem(doneKey)){
      fireRemind(r, doneKey);
    }

    window._remindTimer = setTimeout(()=>{
      fireRemind(r, 'xiaomiqian_dai_remind_'+todayStr());
      setupReminder();   // 重新排明天
    }, Math.max(delay, 1000));
  };
  tick();
}

function fireRemind(r, doneKey){
  localStorage.setItem(doneKey, '1');
  const text = r.text || '今天记账了吗？👛';
  const pushed = pushNotify('👛 小钱袋提醒', text);
  if(DB.data.settings._remindToast !== false){
    toast('⏰ '+text);
  }
  return pushed;
}

/* =========================================================
   📌 打开时的轻提醒（预算超支 / 挑战进度 / 周报）
   ========================================================= */
function checkAlerts(){
  setTimeout(()=>{
    // 1) 预算超支预警
    const b = getBudget();
    const [f,t] = monthRange();
    const mExp = sumRange(f,t,'expense');
    if(b.total && mExp > b.total){
      toast(`🚨 本月已超支 ¥${fmtMoney(mExp-b.total)}，小钱袋替你捏把汗…`);
      return;
    }
    if(b.total && mExp >= b.total*0.85){
      toast(`⚠️ 本月预算已用 ${(mExp/b.total*100).toFixed(0)}%，悠着点花～`);
      return;
    }
    // 2) 挑战打卡提醒
    const curBook = DB.data.curBook==='all' ? DB.data.books[0].id : DB.data.curBook;
    const pending = DB.data.challenges.filter(c=>(c.book===curBook||DB.data.curBook==='all') && currentChalPeriod(c)>=0);
    if(pending.length){
      const c = pending[0];
      const p = currentChalPeriod(c);
      toast(`🎊 「${c.name}」第 ${p+1} 期还没打卡哦～`);
      return;
    }
    // 3) 连续未记账提醒
    const streak = calcStreak();
    if(streak===0 && DB.data.tx.length>0){
      toast('😴 有几天没记账啦，来补一笔？');
    }
  }, 4200);
}

/* 周期项到期待入账提示 */
function autoRunRecurring(){
  const due = DB.data.recurring.filter(r=> r.nextDate <= todayStr());
  if(!due.length) return;
  setTimeout(()=>{
    const names = due.map(r=>r.name).join('、');
    if(confirm(`🔁 有 ${due.length} 项周期记账到期待入账：\n${names}\n\n现在自动入账吗？`)){
      due.forEach(r=>{
        addItems([{type:r.type, amount:r.amount, category:r.category, note:r.name}]);
        const d = parseDate(r.nextDate);
        if(r.cycle==='monthly') d.setMonth(d.getMonth()+1);
        else if(r.cycle==='weekly') d.setDate(d.getDate()+7);
        else d.setDate(d.getDate()+1);
        r.nextDate = fmtDate(d);
      });
      DB.save(true); toast('✅ 周期账目已入账'); flyCoins(5);
      refreshIfNeeded();
    }
  }, 1200);
}

/* 月初 / 周一 报告提示 */
function autoWeeklyReportHint(){
  const n = new Date();
  const isMonday = n.getDay()===1;
  const isMonthStart = n.getDate()===1;
  setTimeout(()=>{
    if(isMonthStart){
      const lf = fmtDate(new Date(n.getFullYear(),n.getMonth()-1,1));
      const lt = fmtDate(new Date(n.getFullYear(),n.getMonth(),0));
      const r = buildReport(lf,lt,'月报');
      if(r.exp.length){
        toast(`📑 上月账单出炉！共支出 ¥${fmtMoney(r.expSum)}`);
        return;
      }
    }
    if(isMonday){
      const [f,t] = weekRange(1);
      const r = buildReport(f,t,'周报');
      if(r.exp.length){
        toast(`📅 上周周报已生成！共支出 ¥${fmtMoney(r.expSum)}`);
      }
    }
  }, 2600);
}

document.addEventListener('DOMContentLoaded', initApp);
</script>
</body>
</html>
